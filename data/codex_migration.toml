schema_version = 1
source_marketplace = ".claude-plugin/marketplace.json"

[[packages]]
name = "mz-base"
disposition = "ready"

[[packages]]
name = "mz-dev-pipe"
disposition = "dependent"
dependencies = ["mz-base"]
# optimize isolates each candidate in a Claude Code worktree; Codex has no equivalent.
excluded_skills = ["optimize"]

[[packages]]
name = "mz-research-pipe"
disposition = "dependent"
dependencies = ["mz-base", "mz-dev-pipe"]

[[packages]]
name = "mz-dev-git"
disposition = "dependent"
dependencies = ["mz-base"]

[[packages]]
name = "mz-creative"
disposition = "dependent"
dependencies = ["mz-base"]

[[packages]]
name = "mz-funny"
disposition = "ready"

[[packages]]
name = "mz-memory"
disposition = "ready"

[[packages]]
name = "mz-handoff"
disposition = "ready"

[[packages]]
name = "mz-design"
disposition = "ready"

[[packages]]
name = "mz-knowledge"
disposition = "ready"

[[packages]]
name = "mz-gov"
disposition = "dependent"
dependencies = ["mz-base"]

[[packages]]
name = "mz-rules"
disposition = "blocked"
blockers = [
    "init-rules writes Claude settings.json hooks, and the CLAUDE.md -> AGENTS.md rewrite garbles its AGENTS.md guard.",
]

[[packages]]
name = "mz-orchestrate"
disposition = "blocked"
dependencies = ["mz-base", "mz-creative", "mz-dev-git", "mz-dev-pipe", "mz-research-pipe"]
blockers = [
    "Runs workers through Claude Code subagent worktree isolation, cross-session messaging (ListAgents, SendMessage) and the claude CLI; Codex has no equivalent.",
]
