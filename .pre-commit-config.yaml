repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: pretty-format-json
        args: [--autofix, --indent, "2"]
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.21
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-frontmatter
          - mdformat-tables
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-e, "SC1091"]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.11.0-1
    hooks:
      - id: shfmt
        args: [-i, "2", -ci]
  - repo: local
    hooks:
      - id: hook-script-head-guard
        name: hook scripts end `| head` pipelines with `|| true`
        language: pygrep
        entry: '\|\s*head\b(?!.*\|\|\s*true)'
        files: '^plugins/[^/]+/scripts/.+\.sh$'
      - id: skill-reference-path
        name: skills reach reference files through SKILL_DIR
        language: pygrep
        entry: '(^|[^/>}A-Za-z_-])references/[a-z0-9_-]+\.md'
        files: '^plugins/[^/]+/skills/[^/]+/(SKILL|phases/[^/]+)\.md$'
      - id: skill-description-shape
        name: skill descriptions are one line with no < or >
        language: pygrep
        entry: '^description:(\s*$|\s*\||.*[<>])'
        files: '^plugins/[^/]+/skills/[^/]+/SKILL\.md$'
