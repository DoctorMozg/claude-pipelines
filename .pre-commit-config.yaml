repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: pretty-format-json
        args: [--autofix, --indent, "2"]
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.21
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          # 2.1+ keeps the quotes around frontmatter values; 2.2 needs mdformat 1.0.
          - mdformat-frontmatter==2.1.2
          - mdformat-tables
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-e, "SC1091"]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.11.0-1
    hooks:
      - id: shfmt
        args: [-i, "2", -ci]
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, files from pyproject)
        language: python
        entry: mypy
        pass_filenames: false
        types: [python]
        additional_dependencies:
          - mypy==1.20.2
          - pydantic>=2.11,<3
          - pyyaml>=6.0,<7
          - types-pyyaml>=6.0.12,<7
          - pytest>=8.4,<9
      - id: hook-script-head-guard
        name: hook scripts end `| head` pipelines with `|| true`
        language: pygrep
        entry: '\|\s*head\b(?!.*\|\|\s*true)'
        files: '^plugins/[^/]+/scripts/.+\.sh$'
      - id: skill-reference-path
        name: skills reach reference files through SKILL_DIR
        language: pygrep
        entry: '(^|[^/>}A-Za-z_-])references/[a-z0-9_-]+\.md'
        files: '^plugins/[^/]+/skills/[^/]+/(SKILL|phases/[^/]+)\.md$'
      - id: skill-description-shape
        name: skill descriptions are one line with no < or >
        language: pygrep
        entry: '^description:(\s*$|\s*\||.*[<>])'
        files: '^plugins/[^/]+/skills/[^/]+/SKILL\.md$'
      - id: no-rule-citations
        name: plugin files cite guidelines by section title, never by number
        language: pygrep
        entry: '\bRules? \d+\b|_GUIDELINES(\.md)?\W{1,3}(§|[Ss]ection |Rule )\s?\d|STATE_SCHEMA(\.md)?\W{1,3}(§|[Ss]ection )\s?\d|§\s?\d+\W{1,3}(of|in) \w*(_GUIDELINES|STATE_SCHEMA)'
        files: '^plugins/.+\.md$'
