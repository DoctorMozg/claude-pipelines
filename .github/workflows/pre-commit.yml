name: pre-commit

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pydantic>=2.11,<3" "pyyaml>=6.0,<7" "pytest>=8.4,<9"
      - run: make test PYTHON=python

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Pinned so a CLI release can't change the validator under us; bump it with the local version.
      - run: npm install -g @anthropic-ai/claude-code@2.1.316
      - run: make validate
