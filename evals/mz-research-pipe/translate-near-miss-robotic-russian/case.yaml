schema_version: "1.1"
name: translate-near-miss-robotic-russian
description: Rewriting a document that is already in Russian so it reads less robotic, with no change of language, belongs to naturalize.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-research-pipe", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-base", "../../../plugins/mz-creative"]
execution:
  prompt: >-
    docs/ru/getting-started.md came out of a machine translation and it sounds stiff
    and robotic, nothing like a native speaker would write. Rewrite it so it reads
    naturally. It has to stay in Russian.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: translate-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?translate"'
    min: 0
    max: 0
    arm: both
  - name: naturalize-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?naturalize"'
