schema_version: "1.1"
name: translate-args-no-target-language
description: 'translate given a file but no target language asks which language in chat, dispatches no agent and writes no translated file.'
tags: [track-d, args]
plugins: ["../../../plugins/mz-research-pipe", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-research-pipe:translate docs/guide.md
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep]
  max_turns: 10
  timeout_seconds: 240
graders:
  # AskUserQuestion isn't available in eval sessions, so the missing language is asked in chat.
  - name: language-requested
    type: regex
    pattern: '^(?=[\s\S]*\blanguage\b)(?=[\s\S]*\?)'
    flags: i
  - name: no-agent-dispatched
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: no-file-written-under-docs
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/docs/'
    min: 0
    max: 0
  - name: no-file-edited-under-docs
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*/docs/'
    min: 0
    max: 0
  - name: guide-intact
    type: regex
    pattern: '\{\{user\.name\}\}'
    target: { source: file, path: docs/guide.md }
