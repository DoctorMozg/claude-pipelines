schema_version: "1.1"
name: explain-behavior-payment-retry
description: 'explain on a small stdlib-only module writes a diagram-rich report with file:line references at the requested path through one researcher, and edits no source file.'
tags: [track-d, behavior]
plugins: ["../../../plugins/mz-research-pipe", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-research-pipe:explain output:explain_report.md src/payments/ how does the retry logic work
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep]
  max_turns: 25
  timeout_seconds: 600
graders:
  # A slash-command prompt loads the skill without a Skill tool call, so look for the task folder only the skill names.
  - name: explain-ran
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/\.mz/task/\d{4}_\d{2}_\d{2}_explain_[^"]*"'
  # Four stdlib-only files fall in the single comprehensive analyst row of the dispatch matrix.
  - name: one-researcher-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-researcher"'
    min: 1
    max: 1
  # The researcher is read-only, so the orchestrator writes its findings file.
  - name: researcher-output-persisted
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/research_comprehensive\.md"'
  - name: report-header
    type: regex
    pattern: '^# Code Explanation'
    flags: m
    target: { source: file, path: explain_report.md }
  - name: two-or-more-mermaid-blocks
    type: regex
    pattern: '```mermaid[\s\S]*```mermaid'
    target: { source: file, path: explain_report.md }
  - name: architecture-graph
    type: regex
    pattern: '^\s*(?:graph|flowchart)\s+(?:TD|LR)\b'
    flags: m
    target: { source: file, path: explain_report.md }
  - name: execution-flow-diagram
    type: regex
    pattern: '^\s*(?:sequenceDiagram|flowchart)\b'
    flags: m
    target: { source: file, path: explain_report.md }
  - name: file-line-references
    type: regex
    pattern: 'retry\.py:\d+'
    target: { source: file, path: explain_report.md }
  # Both facts come from retry.py, so a hit shows the report answers the question from the code.
  - name: answers-from-the-code
    type: regex
    pattern: '^(?=[\s\S]*TransientError)(?=[\s\S]*0\.25)'
    target: { source: file, path: explain_report.md }
  - name: source-not-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/src/payments/'
    min: 0
    max: 0
  - name: source-not-edited
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*/src/payments/'
    min: 0
    max: 0
  - name: source-intact
    type: regex
    pattern: 'BASE_DELAY = 0\.25'
    target: { source: file, path: src/payments/retry.py }
