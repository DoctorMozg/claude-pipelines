schema_version: "1.1"
name: translate-fire-docs-japanese
description: Producing Japanese copies of a docs directory is a multi-file translation job, which belongs to translate even without its trigger words.
tags: [routing, fire, held-out]
plugins: ["../../../plugins/mz-research-pipe", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-base", "../../../plugins/mz-creative"]
execution:
  prompt: >-
    The docs/ folder in our repo is English only, and the Tokyo team can't read
    most of it. I want Japanese versions of every guide in there, saved next to the
    originals. Leave the code samples and command names alone.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: translate-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?translate"'
