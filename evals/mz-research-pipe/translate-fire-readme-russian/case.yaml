schema_version: "1.1"
name: translate-fire-readme-russian
description: Translating a README file into another language is a file translation, which belongs to translate.
tags: [routing, fire]
plugins: ["../../../plugins/mz-research-pipe", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-base", "../../../plugins/mz-creative"]
execution:
  prompt: >-
    Translate README.md to Russian. Keep the code blocks and the badge links
    exactly as they are.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: translate-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?translate"'
