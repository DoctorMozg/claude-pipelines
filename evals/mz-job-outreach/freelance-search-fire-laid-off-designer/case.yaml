schema_version: "1.1"
name: freelance-search-fire-laid-off-designer
description: A laid-off designer who rejects full-time work and wants a ranked list of open short projects at an hourly floor is asking for freelance-search.
tags: [routing, fire, held-out]
plugins: ["../../../plugins/mz-job-outreach", "../../../plugins/mz-biz-outreach", "../../../plugins/mz-creative", "../../../plugins/mz-base"]
execution:
  prompt: >-
    Got laid off last week and honestly I don't want another full-time job right
    now. I'm a product designer, 8 years, mostly fintech. What short projects are
    open at the moment for someone like me? I need 150 an hour at minimum, clients
    in the US or Canada, remote. Put together a ranked list of the real openings so
    I can start reaching out.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: freelance-search-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?freelance-search"'
