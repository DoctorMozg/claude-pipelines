schema_version: "1.1"
name: job-search-fire-laid-off-resume
description: A laid-off user pointing at a resume file and asking for ranked salaried positions plus application letters wants the job-search pipeline without using its trigger phrases.
tags: [routing, fire, held-out]
plugins: ["../../../plugins/mz-job-outreach", "../../../plugins/mz-biz-outreach", "../../../plugins/mz-creative", "../../../plugins/mz-base"]
execution:
  prompt: >-
    I got laid off in October and need to be employed again by January. My resume
    is in ~/Documents/resume_2026.md. Go through who's hiring senior data engineers
    that can work from Poland, posted in the last couple of weeks, rank them by how
    well I fit, and write me a short application letter for each of the top five.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: job-search-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?job-search"'
