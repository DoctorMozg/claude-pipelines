schema_version: "1.1"
name: freelance-pitch-near-miss-salaried-cover-letter
description: A cover letter for a permanent full-time opening is salaried-role writing, which belongs to copywrite rather than a freelance proposal.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-job-outreach", "../../../plugins/mz-biz-outreach", "../../../plugins/mz-creative", "../../../plugins/mz-base"]
execution:
  prompt: >-
    Applying for the Senior Data Engineer opening at Brightwave Analytics in
    Stockholm, permanent and full-time. My resume is at ~/Documents/resume_2026.pdf
    and I pasted the job description into jd.txt. Write the cover letter, around
    300 words.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: freelance-pitch-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?freelance-pitch"'
    min: 0
    max: 0
    arm: both
  - name: copywrite-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?copywrite"'
