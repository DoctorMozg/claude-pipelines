schema_version: "1.1"
name: freelance-search-near-miss-agency-prospects
description: Building a ranked list of prospect companies to cold email for the user's own consultancy is B2B lead generation, so it belongs to outreach-research.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-job-outreach", "../../../plugins/mz-biz-outreach", "../../../plugins/mz-creative", "../../../plugins/mz-base"]
execution:
  prompt: >-
    We're a four-person data consultancy and our pipeline is thin. We take fixed-price
    contract projects, but nobody posts those publicly, so I don't want listings. I
    want companies to cold email. Build me a prospect list of 30 mid-size retailers in
    the Netherlands and Belgium that probably need a data platform migration, ranked
    by fit, with what each one does and who on their side we should contact. This
    feeds our outbound sales push next month.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: freelance-search-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?freelance-search"'
    min: 0
    max: 0
    arm: both
  - name: outreach-research-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?outreach-research"'
