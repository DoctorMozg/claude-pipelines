schema_version: "1.1"
name: memory-note-near-miss-recall
description: 'The user wants to read what memory holds, which memory-note does not do.'
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-memory"]
execution:
  prompt: >-
    What do we have saved in project memory about the auth refactor?
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: memory-note-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?memory-note"'
    min: 0
    max: 0
    arm: both
