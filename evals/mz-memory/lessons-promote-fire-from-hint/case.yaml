schema_version: "1.1"
name: lessons-promote-fire-from-hint
description: 'The SessionStart hint names promotion candidates and the user agrees to go through them.'
tags: [routing, fire, held-out]
plugins: ["../../../plugins/mz-memory"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    Sure, let's go through the promotion candidates you mentioned.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: lessons-promote-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?lessons-promote"'
  - name: session-start-offered-promotion
    type: regex
    pattern: '"subtype":"hook_response"[^\n]*Promotion candidates \(seen 3\+ times\): L-0001\. At a natural pause, offer /lessons-promote'
    target: trace
