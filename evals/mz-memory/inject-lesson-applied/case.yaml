schema_version: "1.1"
name: inject-lesson-applied
description: 'SessionStart injects curated lessons without their metadata, flags promotion candidates, and the model applies a lesson it was never told in the prompt.'
tags: [hooks, inject, lessons]
plugins: ["../../../plugins/mz-memory"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    I'm adding a migration that puts an index on orders.created_at. What path should the new file
    get? Reply with just the path, or UNKNOWN if this project has no convention for it.
    Answer from what you already know about this project; don't search the files.
  allowed_tools: []
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: answer-applies-lesson
    type: regex
    pattern: 'db/migrations/MIG-'
  - name: session-start-injected-lessons
    type: regex
    pattern: '"subtype":"hook_response"[^\n]*## Lessons \(\.mz/memory/lessons\.md\)\\+nAdvice from earlier sessions[^\\]*\\+n- \[L-[0-9]{4}\] '
    target: trace
  - name: session-start-injected-inbox-item
    type: regex
    pattern: '"subtype":"hook_response"[^\n]*- \[I-0001\] WHEN CI times out'
    target: trace
  - name: session-start-offered-promotion
    type: regex
    pattern: '"subtype":"hook_response"[^\n]*Promotion candidates \(seen 3\+ times\): L-0001\.'
    target: trace
  - name: lesson-metadata-stripped
    type: regex
    pattern: '"subtype":"hook_response"[^\n]*n=4 last=2026-10-28'
    match: not_contains
    target: trace
  - name: lesson-not-read-from-disk
    type: regex
    pattern: '"type":"tool_result"[^\n]*MIG-'
    match: not_contains
    target: trace
