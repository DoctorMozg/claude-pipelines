schema_version: "1.1"
name: prompt-deep-entry
description: 'An entry older than the 200 lines SessionStart injects reaches the model through the UserPromptSubmit keyword match.'
tags: [hooks, inject, prompt]
plugins: ["../../../plugins/mz-memory"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    Which port does the marmoset-bridge staging database listen on? Reply with just the number,
    or UNKNOWN if you don't know.
    Answer from what you already know about this project; don't search the files.
  allowed_tools: []
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: answer-has-port
    type: regex
    pattern: '\b6543\b'
  - name: session-start-injected-memory
    type: regex
    pattern: '"subtype":"hook_response"[^\n]*Project memory'
    target: trace
  - name: session-start-left-entry-out
    type: regex
    pattern: '"subtype":"hook_response"[^\n]*OPAL-19'
    match: not_contains
    target: trace
  - name: fact-not-read-from-disk
    type: regex
    pattern: '"type":"tool_result"[^\n]*6543'
    match: not_contains
    target: trace
