schema_version: "1.1"
name: memory-note-fire-known-flake
description: Asking that a fact about one test file carry over to every later session on the repo is a project-memory note, so it belongs to memory-note.
tags: [routing, fire, held-out]
plugins: ["../../../plugins/mz-memory", "../../../plugins/mz-base"]
execution:
  prompt: >-
    The intermittent failure in tests/integration/test_payments.py is the Stripe sandbox
    timing out, not a bug in our code. I've lost two afternoons to it. Make sure whoever
    picks this repo up next session already knows that before they start digging.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: memory-note-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?memory-note"'
