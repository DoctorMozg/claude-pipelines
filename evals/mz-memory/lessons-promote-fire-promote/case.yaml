schema_version: "1.1"
name: lessons-promote-fire-promote
description: 'The user asks to promote the lessons that keep recurring into project rules.'
tags: [routing, fire]
plugins: ["../../../plugins/mz-memory"]
execution:
  prompt: >-
    Promote the lessons that keep coming up into proper project rules.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: lessons-promote-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?lessons-promote"'
