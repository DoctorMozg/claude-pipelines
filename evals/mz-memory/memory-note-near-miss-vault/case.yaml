schema_version: "1.1"
name: memory-note-near-miss-vault
description: 'Raw meeting notes headed for an Obsidian vault belong to process-notes, not project memory.'
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-memory", "../../../plugins/mz-knowledge"]
execution:
  prompt: >-
    Here are my raw notes from the architecture sync. Turn them into permanent atomic notes in
    my Obsidian vault: event bus replaces cron jobs; retries move to the queue; Dana owns the
    migration.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: memory-note-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?memory-note"'
    min: 0
    max: 0
    arm: both
  - name: process-notes-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?process-notes"'
