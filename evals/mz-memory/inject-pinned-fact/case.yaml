schema_version: "1.1"
name: inject-pinned-fact
description: 'SessionStart injects the Pinned section, so the model answers a project fact it was never told in the prompt.'
tags: [hooks, inject]
plugins: ["../../../plugins/mz-memory"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    What's the deploy codename for this service? Reply with just the codename, or UNKNOWN if you
    don't know it.
    Answer from what you already know about this project; don't search the files.
  allowed_tools: []
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: answer-has-codename
    type: regex
    pattern: QUILLFEATHER
  - name: hook-injected-codename
    type: regex
    pattern: '"subtype":"hook_response"[^\n]*QUILLFEATHER'
    target: trace
  - name: fact-not-read-from-disk
    type: regex
    pattern: '"type":"tool_result"[^\n]*QUILLFEATHER'
    match: not_contains
    target: trace
