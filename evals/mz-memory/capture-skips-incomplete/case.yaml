schema_version: "1.1"
name: capture-skips-incomplete
description: 'SessionEnd logs only completed tasks, but collects Lessons from every task, including unfinished ones.'
tags: [hooks, capture]
plugins: ["../../../plugins/mz-memory"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    Reply with just OK.
  allowed_tools: []
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: complete-task-logged
    type: regex
    pattern: '2026_11_01_build_export_csv'
    target: { source: file, path: .mz/memory/MEMORY.md }
  - name: incomplete-task-not-logged
    type: regex
    pattern: '2026_11_02_debug_flaky_upload|Switch uploads to multipart'
    match: not_contains
    target: { source: file, path: .mz/memory/MEMORY.md }
  - name: incomplete-task-lesson-in-inbox
    type: regex
    pattern: 'Retry uploads only on 5xx responses'
    target: { source: file, path: .mz/memory/lessons.md }
