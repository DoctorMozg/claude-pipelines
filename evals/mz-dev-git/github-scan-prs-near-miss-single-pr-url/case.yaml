schema_version: "1.1"
name: github-scan-prs-near-miss-single-pr-url
description: A request to judge one specific pull request by its URL is a deep review of a single PR, so it belongs to github-review-pr.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-dev-git", "../../../plugins/mz-base"]
execution:
  prompt: >-
    A teammate opened https://github.com/astral-sh/ruff/pull/14231 and asked me
    to sign off on it. Go through the whole change and tell me if it's safe to
    merge. I'm mostly worried about what it does to the parser.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: github-scan-prs-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-scan-prs"'
    min: 0
    max: 0
    arm: both
  - name: github-review-pr-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-review-pr"'
