schema_version: "1.1"
name: github-scan-prs-near-miss-local-branch
description: Reviewing the unpushed changes on the user's own local branch before opening a pull request belongs to review-branch.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-dev-git", "../../../plugins/mz-base"]
execution:
  prompt: >-
    I've been on feature/oauth-refresh for a few days, around 20 commits, and
    haven't pushed anything yet. Before I open a pull request against main, go
    over everything I changed on this branch and tell me what I missed.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: github-scan-prs-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-scan-prs"'
    min: 0
    max: 0
    arm: both
  - name: review-branch-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review-branch"'
