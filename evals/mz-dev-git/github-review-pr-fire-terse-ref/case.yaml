schema_version: "1.1"
name: github-review-pr-fire-terse-ref
description: A user asks to review a GitHub pull request by owner/repo#number, so github-review-pr should handle it.
tags: [routing, fire]
plugins: ["../../../plugins/mz-dev-git", "../../../plugins/mz-base"]
execution:
  prompt: >-
    review PR tokio-rs/tokio#6890, I mainly care about whether the new cancellation path
    leaks anything
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: github-review-pr-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-review-pr"'
