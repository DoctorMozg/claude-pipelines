schema_version: "1.1"
name: review-branch-worker-blocks-without-base
description: 'A final review brief that names no base branch. review-branch in worker mode must not read the unit: token as the base or ask the user: it blocks in state, ends STATUS: BLOCKED and dispatches no reviewer.'
tags: [worker, track-d, needs-bash]
plugins: ["../../../plugins/mz-dev-git", "../../../plugins/mz-base"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-dev-git:review-branch unit:units/FR1-app.md
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep, Bash, AskUserQuestion]
  max_turns: 20
  timeout_seconds: 400
graders:
  # A slash prompt loads the skill without a Skill call, so the state file only the skill writes proves it ran.
  - name: review-branch-ran
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_review_branch_[A-Za-z0-9_-]+/state\.md'
    target: trace
  - name: worker-mode-recorded
    type: regex
    pattern: '_review_branch_[A-Za-z0-9_-]+/state\.md[^\n]*unattended: worker'
    target: trace
  - name: never-asks-the-user
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
  - name: no-reviewer-dispatched
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: token-not-used-as-base
    type: tool_used
    tool: Bash
    input_match: 'git\s+(?:diff|log|rev-parse|merge-base)[^"]*unit:'
    min: 0
    max: 0
  - name: blocker-in-state
    type: regex
    pattern: '_review_branch_[A-Za-z0-9_-]+/state\.md[^\n]*Status: blocked'
    target: trace
  - name: ends-with-status-blocked
    type: regex
    pattern: '"role":"assistant","content":\[\{"type":"text","text":"(?=[^\n]*STATUS: BLOCKED)[^\n]*"parent_tool_use_id":null'
    target: trace
  - name: no-write-outside-mz
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
