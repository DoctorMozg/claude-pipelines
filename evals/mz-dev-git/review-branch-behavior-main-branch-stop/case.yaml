schema_version: "1.1"
name: review-branch-behavior-main-branch-stop
description: 'review-branch run on main finds nothing to diff, records nothing_to_review in state.md and dispatches no branch-reviewer.'
tags: [track-d, behavior, needs-bash]
plugins: ["../../../plugins/mz-dev-git", "../../../plugins/mz-base"]
runs: 1
# Bash is granted for the read-only git branch check: make eval PLUGIN=mz-dev-git EVAL_ARGS="--allow-tools Bash --case review-branch-behavior-*"
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-dev-git:review-branch
  allowed_tools: [Skill, Agent, Bash, Read, Write, Edit, Glob, Grep]
  max_turns: 15
  timeout_seconds: 300
graders:
  # A slash-command prompt loads the skill without a Skill tool call, so look for the task folder only the skill names.
  - name: review-branch-ran
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/\.mz/task/\d{4}_\d{2}_\d{2}_review_branch_main[^"]*/state\.md"'
  - name: branch-checked-with-git
    type: tool_used
    tool: Bash
    input_match: 'git (?:branch|rev-parse|symbolic-ref|status)'
  - name: nothing-to-review-recorded
    type: regex
    pattern: '"name"\s*:\s*"(?:Write|Edit)"[^\n]*nothing_to_review'
    target: trace
  - name: reply-says-nothing-to-review
    type: regex
    pattern: '^(?=[\s\S]*\bmain\b)(?=[\s\S]*(?:nothing to (?:review|diff)|no (?:changes|commits|diff)))'
    flags: i
  - name: no-branch-reviewer-dispatched
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: no-report-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/\.mz/reviews/'
    min: 0
    max: 0
  - name: readme-intact
    type: regex
    pattern: 'A tiny service used by the review-branch eval'
    target: { source: file, path: README.md }
