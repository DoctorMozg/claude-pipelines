schema_version: "1.1"
name: brainstorm-fire-onboarding-dropoff
description: The user asks for a wide spread of new ideas on an open product problem, so brainstorm should handle it.
tags: [routing, fire]
plugins: ["../../../plugins/mz-creative", "../../../plugins/mz-base"]
execution:
  prompt: >-
    Let's brainstorm. I'm building a note-taking app for students and about 60% of
    signups quit before they create their first note. I want a wide spread of ideas
    for fixing that, not just the obvious tooltip tour.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: brainstorm-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?brainstorm"'
