schema_version: "1.1"
name: expert-near-miss-retro-formats
description: The user has no format yet and wants a batch of new ideas from differently minded thinkers, which belongs to brainstorm instead of expert.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-creative", "../../../plugins/mz-base"]
execution:
  prompt: >-
    Our weekly team retro has gone stale and I don't have a replacement format in
    mind yet. If you got a panel of experts in a room, what would they come up with?
    I want a big batch of new format ideas from people who think very differently
    from each other, say a psychologist, a game designer, a historian.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: expert-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?expert"'
    min: 0
    max: 0
    arm: both
  - name: brainstorm-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?brainstorm"'
