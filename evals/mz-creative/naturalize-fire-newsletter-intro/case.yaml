schema_version: "1.1"
name: naturalize-fire-newsletter-intro
description: A pasted paragraph with a request to humanize it is the core naturalize job, close to its trigger wording.
tags: [routing, fire]
plugins: ["../../../plugins/mz-creative", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-research-pipe"]
execution:
  prompt: >-
    humanize this paragraph for me, it opens tomorrow's newsletter: "In today's
    fast-paced digital landscape, it is crucial for teams to leverage seamless
    collaboration tools. Moreover, by fostering a culture of transparency, organizations
    can unlock their full potential."
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: naturalize-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?naturalize"'
