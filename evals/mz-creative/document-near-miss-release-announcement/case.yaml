schema_version: "1.1"
name: document-near-miss-release-announcement
description: A blog and newsletter announcement meant to excite readers about a release is promotional copy, so it belongs to copywrite.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-creative", "../../../plugins/mz-base"]
execution:
  prompt: >-
    Version 3.0 of our open-source CLI went out last night. Write the announcement for the blog and
    the newsletter. I want readers excited about the new plugin system and clicking through to
    upgrade, so lead with what they get, not with the changelog.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: document-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?document"'
    min: 0
    max: 0
    arm: both
  - name: copywrite-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?copywrite"'
