schema_version: "1.1"
name: naturalize-fire-wedding-speech
description: Reworking a generic, machine-sounding speech draft into the speaker's own voice is naturalize, stated as a goal with no file and no skill vocabulary.
tags: [routing, fire, held-out]
plugins: ["../../../plugins/mz-creative", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-research-pipe"]
execution:
  prompt: >-
    So my sister asked me to speak at her wedding and I had a chatbot write the first
    draft. It's technically fine but awful. Every line is a polished little aphorism,
    nothing sounds like me, and there isn't a single joke only family would get. Here's
    the opening, the rest is the same: "Today we gather to celebrate a love that
    transcends time, a bond that weaves two lives into one beautiful tapestry." Can
    you redo the whole thing so it sounds like her younger brother, the one who
    swears occasionally and still owes her forty bucks?
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: naturalize-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?naturalize"'
