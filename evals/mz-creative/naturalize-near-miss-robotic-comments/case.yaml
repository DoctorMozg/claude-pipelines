schema_version: "1.1"
name: naturalize-near-miss-robotic-comments
description: Stripping generated-sounding comments and docstrings from source files is comment cleanup, so it belongs to decomment and not to a prose rewrite.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-creative", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-research-pipe"]
execution:
  prompt: >-
    Half the comments in the Python files on my branch were written by an assistant and
    it shows. There's a "# Initialize the database connection" right above
    db = connect(), docstrings that just restate the signature, and banner lines like
    "# ===== Helpers =====". Strip that stuff out of the comments, but leave the code and
    the comments that explain why alone.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: naturalize-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?naturalize"'
    min: 0
    max: 0
    arm: both
  - name: decomment-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?decomment"'
