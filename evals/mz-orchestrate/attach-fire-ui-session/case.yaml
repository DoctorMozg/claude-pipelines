schema_version: "1.1"
name: attach-fire-ui-session
description: Making another running session a worker that only gets UI units is attaching it with a purpose, which belongs to orchestrate-attach.
tags: [routing, fire]
plugins: ["../../../plugins/mz-orchestrate", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-dev-git", "../../../plugins/mz-creative", "../../../plugins/mz-base"]
execution:
  prompt: >-
    I have another Claude session open in the web repo. Hook it up so it takes work from this one, but only the frontend UI pieces.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: attach-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestrate-attach"'
