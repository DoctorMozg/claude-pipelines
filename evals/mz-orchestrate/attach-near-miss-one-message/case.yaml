schema_version: "1.1"
name: attach-near-miss-one-message
description: Passing one note to another session is a single message, not making it a worker, so neither attach nor detach should fire.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-orchestrate", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-dev-git", "../../../plugins/mz-creative", "../../../plugins/mz-research-pipe", "../../../plugins/mz-base"]
execution:
  prompt: >-
    Tell my other Claude session that the staging deploy finished, that's all.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: no-orchestrate-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestrate-(?:attach|detach)"'
    min: 0
    max: 0
