schema_version: "1.1"
name: plan-near-miss-existing-plan
description: A plan that already exists only needs running, which is orchestrate, so orchestrate-plan should not fire.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-orchestrate", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-dev-git", "../../../plugins/mz-creative", "../../../plugins/mz-research-pipe", "../../../plugins/mz-base"]
execution:
  prompt: >-
    The plan in docs/PLAN.md is final. Split it across parallel agents and run it.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: no-plan-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestrate-plan"'
    min: 0
    max: 0
