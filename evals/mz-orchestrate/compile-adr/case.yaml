schema_version: "1.1"
name: compile-adr
description: 'An accepted ADR compiles into units that keep its decision: the token bucket and the handler change, with the handler unit depending on the bucket unit, and no Redis.'
tags: [compile, needs-bash]
plugins: ["../../../plugins/mz-orchestrate", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-dev-git", "../../../plugins/mz-creative", "../../../plugins/mz-research-pipe", "../../../plugins/mz-base"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    docs/adr/0007-rate-limiting.md is accepted. Orchestrate the work it decides.
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep, Bash, AskUserQuestion]
  max_turns: 80
  timeout_seconds: 2400
graders:
  - name: orchestrate-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestrate"'
  - name: dag-written
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_orchestrate_[a-z0-9_]+/dag\.json'
    target: trace
  # The skill runs dag.sh lint itself; its output in a tool result is the evidence, not the compiler's claim.
  - name: dag-lints-clean
    type: regex
    pattern: 'lint: ok \(\d+ units\)'
    target: trace
  - name: reviewer-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?orchestrate-dag-reviewer"'
    min: 1
  - name: gate-shows-the-dag
    type: regex
    pattern: '## Plan for review: orchestrate[\s\S]*graph TD'
    target: trace
  - name: source-kind-recorded
    type: regex
    pattern: 'source_kind: adr'
    target: trace
  # Compiling never touches the code; only .mz/ artifacts are written.
  - name: no-edit-outside-mz
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
  - name: no-write-outside-mz
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
  - name: handler-waits-for-bucket
    type: regex
    pattern: '\| [A-Za-z0-9-]+_\w+ \| [^|\n]*(?:[Hh]andler|[Ll]imit)[^|\n]* \|(?:[^|\n]*\|){4} [A-Za-z0-9-]+_\w+ \|'
    target: trace
