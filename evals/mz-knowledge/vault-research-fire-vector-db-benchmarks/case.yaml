schema_version: "1.1"
name: vault-research-fire-vector-db-benchmarks
description: Asking to import a deep-research report from .mz/research into the vault as atomic notes is the core vault-research job.
tags: [routing, fire]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
execution:
  prompt: >-
    Import the deep-research report at
    .mz/research/2026_10_30_deep-research_vector-db-benchmarks.md into my vault
    as atomic notes. It runs to about 3,000 words, so go carefully.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-research-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-research"'
