schema_version: "1.1"
name: vault-answer-fire-jenkins-retro
description: Recalling what the user wrote down over the past year about a topic, with sources per point and the gaps flagged, belongs to vault-answer even without its trigger phrases.
tags: [routing, fire, held-out]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
execution:
  prompt: >-
    The retro is tomorrow and I cannot remember why we left Jenkins. I know I wrote
    about it somewhere in my Zettelkasten over the last year, probably in three or
    four places. Pull together what I wrote, say where each point came from, and flag
    whatever I never recorded. Do not fill the gaps with what you know about Jenkins.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-answer-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-answer"'
