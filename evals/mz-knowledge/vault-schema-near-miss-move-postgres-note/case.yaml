schema_version: "1.1"
name: vault-schema-near-miss-move-postgres-note
description: Moving one note to another folder while keeping every wikilink to it working belongs to vault-refactor, not to a frontmatter check.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
execution:
  prompt: >-
    Move Inbox/Postgres vacuum tuning.md into Areas/Databases/. Every wikilink in
    the vault that points at it has to keep working. Its properties are fine as they
    are, so don't touch the contents.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-schema-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-schema"'
    min: 0
    max: 0
    arm: both
  - name: vault-refactor-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-refactor"'
