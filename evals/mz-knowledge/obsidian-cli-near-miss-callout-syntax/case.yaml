schema_version: "1.1"
name: obsidian-cli-near-miss-callout-syntax
description: Writing a collapsed callout and a heading link into a note is Obsidian Flavored Markdown syntax work, so it belongs to obsidian-markdown, not the CLI.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
execution:
  prompt: >-
    I edit my vault in nvim from the terminal. In Projects/Atlas/Kickoff.md I
    want a warning callout that starts collapsed, plus a link that jumps straight
    to the Risks heading of the Atlas Plan note. What's the exact syntax? Put it
    into the note.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: obsidian-cli-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?obsidian-cli"'
    min: 0
    max: 0
    arm: both
  - name: obsidian-markdown-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?obsidian-markdown"'
