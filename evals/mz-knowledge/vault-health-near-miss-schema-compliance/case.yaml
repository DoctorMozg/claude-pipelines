schema_version: "1.1"
name: vault-health-near-miss-schema-compliance
description: Checking every note's frontmatter against a declared schema and back-filling missing fields belongs to vault-schema, not a vault health audit.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
execution:
  prompt: >-
    I wrote down what a meeting note and a project note should look like in
    .mz/vault-schema.yml. Check every note in my vault against it and list the ones
    that are missing required frontmatter fields or use a status value that is not in
    the allowed list. Once I have looked at the list, back-fill the missing fields.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-health-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-health"'
    min: 0
    max: 0
    arm: both
  - name: vault-schema-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-schema"'
