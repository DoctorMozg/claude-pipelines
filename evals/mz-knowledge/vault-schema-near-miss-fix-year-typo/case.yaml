schema_version: "1.1"
name: vault-schema-near-miss-fix-year-typo
description: Correcting one sentence in a note body is a plain edit that needs no skill, even though the note carries a status property.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    Reading/Show Your Work.md is already marked status: evergreen and everything at
    the top of it is correct. The only problem is in the Takeaways section, where I
    wrote that the book came out in 2019. It was 2014. Fix that one sentence.
  # The right move is the job itself, so the session has the file and the tools for it; a skill call still fails the case.
  allowed_tools: [Skill, Read, Grep, Glob, Edit]
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: vault-schema-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-schema"'
    min: 0
    max: 0
    arm: both
  - name: year-fixed
    type: regex
    pattern: 'came out in 2014'
    target: { source: file, path: "Reading/Show Your Work.md" }
  - name: properties-untouched
    type: regex
    pattern: '(?s)^---\nstatus: evergreen\nauthor: Austin Kleon\ntags: \[book, creativity\]\n---'
    target: { source: file, path: "Reading/Show Your Work.md" }
