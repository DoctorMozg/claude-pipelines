schema_version: "1.1"
name: obsidian-init-fire-team-wiki
description: A terse request to init a new vault for a team wiki matches the bootstrap trigger directly.
tags: [routing, fire]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
execution:
  prompt: >-
    init a vault at ~/vaults/eng-wiki. team engineering wiki, bare minimum setup, no questions
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: obsidian-init-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?obsidian-init"'
