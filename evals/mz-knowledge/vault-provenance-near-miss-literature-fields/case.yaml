schema_version: "1.1"
name: vault-provenance-near-miss-literature-fields
description: Checking a folder of notes against declared frontmatter fields and patching the missing ones is schema compliance, so it belongs to vault-schema.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
execution:
  prompt: >-
    I updated my vault schema in .mz/vault-schema.yml so every literature note
    needs title, author, source_url and status in its frontmatter. Check the
    notes in Literature/ against it, tell me which ones don't comply, and patch
    the missing fields once I okay it.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-provenance-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-provenance"'
    min: 0
    max: 0
    arm: both
  - name: vault-schema-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-schema"'
