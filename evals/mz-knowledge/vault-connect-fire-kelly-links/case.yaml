schema_version: "1.1"
name: vault-connect-fire-kelly-links
description: A direct request to suggest wikilinks and improve link density for one existing note is the core vault-connect job.
tags: [routing, fire]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
execution:
  prompt: >-
    Suggest wikilinks for my Kelly criterion note, it only has one outbound link.
    Improve its link density if you can.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-connect-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-connect"'
