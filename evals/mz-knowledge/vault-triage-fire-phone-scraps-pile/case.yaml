schema_version: "1.1"
name: vault-triage-fire-phone-scraps-pile
description: Working fast through a pile of raw phone captures with a keep, combine, bin or snooze call on each is a batch triage of fleeting notes, so it belongs to vault-triage.
tags: [routing, fire, held-out]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
execution:
  prompt: >-
    Weeks of phone captures have piled up in my vault and half of it is junk or
    duplicates of stuff I already wrote down properly. I'm not trying to rewrite
    any of it, I just want to get through the pile fast, with a quick keep,
    combine, bin or snooze call on each scrap.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-triage-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-triage"'
