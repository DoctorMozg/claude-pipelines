schema_version: "1.1"
name: vault-refactor-fire-vague-caching-title
description: Retitling a heavily referenced note without breaking the notes that reference it is vault-refactor, even though the request never says rename or wikilink.
tags: [routing, fire, held-out]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
execution:
  prompt: >-
    I have an old note called Thoughts on caching that about a dozen of my other
    notes reference. The title tells me nothing, and I want it to state the actual
    claim: Cache invalidation causes most caching bugs. Do it so none of those
    references break, and show me what you're going to touch before you touch it.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-refactor-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-refactor"'
