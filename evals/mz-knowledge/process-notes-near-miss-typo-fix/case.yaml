schema_version: "1.1"
name: process-notes-near-miss-typo-fix
description: Fixing one typo and one punctuation mark in a single note is a quick edit that needs no skill.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    In notes/Spaced repetition beats massed practice.md the second paragraph
    says "retreival" instead of "retrieval". Fix that, and swap the em dash in
    the last sentence for a comma. Nothing else.
  # The right move is the job itself, so the session has the file and the tools for it; a skill call still fails the case.
  allowed_tools: [Skill, Read, Grep, Glob, Edit]
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: process-notes-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?process-notes"'
    min: 0
    max: 0
    arm: both
  - name: typo-fixed
    type: regex
    pattern: 'from retrieval effort'
    target: { source: file, path: "notes/Spaced repetition beats massed practice.md" }
  - name: em-dash-gone
    type: regex
    pattern: '—'
    match: not_contains
    target: { source: file, path: "notes/Spaced repetition beats massed practice.md" }
