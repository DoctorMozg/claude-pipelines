schema_version: "1.1"
name: vault-research-near-miss-orphan-imported-note
description: Finding which existing notes a note already in the vault should link to is vault-connect work, even though the note came from an earlier report import.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
execution:
  prompt: >-
    One of the notes from last week's report import,
    Permanent/research/Quorum reads add latency to every request.md, has no
    outgoing links. Which existing notes should it link to?
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-research-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-research"'
    min: 0
    max: 0
    arm: both
  - name: vault-connect-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-connect"'
