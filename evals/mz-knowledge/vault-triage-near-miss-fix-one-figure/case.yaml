schema_version: "1.1"
name: vault-triage-near-miss-fix-one-figure
description: Correcting one number in a single named note is a direct edit that needs no skill, even though the note sits in the inbox.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
execution:
  prompt: >-
    In inbox/2026-10-30 sourdough hydration.md the second paragraph says 85
    percent hydration. It should be 75. Fix that.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-triage-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-triage"'
    min: 0
    max: 0
    arm: both
