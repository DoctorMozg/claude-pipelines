schema_version: "1.1"
name: obsidian-init-near-miss-claude-md-line
description: Adding one line to the CLAUDE.md of an already configured vault is a direct edit that needs no skill.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    In Brain/CLAUDE.md, under the Don'ts section, add one line saying never
    to create notes in the vault root. The file is already set up, I just want that
    rule added.
  # The right move is the job itself, so the session has the file and the tools for it; a skill call still fails the case.
  allowed_tools: [Skill, Read, Grep, Glob, Edit]
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: obsidian-init-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?obsidian-init"'
    min: 0
    max: 0
    arm: both
  - name: rule-added-under-donts
    type: regex
    pattern: '(?s)## Don''ts.*root'
    target: { source: file, path: "Brain/CLAUDE.md" }
