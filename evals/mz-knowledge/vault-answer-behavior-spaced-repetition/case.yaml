schema_version: "1.1"
name: vault-answer-behavior-spaced-repetition
description: 'vault-answer answers a two-part question from a three-note vault with a wikilink citation, lists the review interval no note records under Unknowns instead of guessing it, and leaves every vault note untouched.'
tags: [behavior, track-d]
plugins: ["../../../plugins/mz-knowledge"]
# Write is a gated tool: make eval PLUGIN=mz-knowledge EVAL_ARGS="--allow-tools Write Edit --case 'vault-answer-behavior-*'"
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-knowledge:vault-answer what does my vault say about spaced repetition vs rereading, and which review interval did I settle on?
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep]
  max_turns: 20
  timeout_seconds: 600
graders:
  # A slash-command prompt loads the skill without a Skill tool call, so look for the task folder only the skill names.
  - name: vault-answer-ran
    type: regex
    pattern: '\.mz/task/\d{4}_\d{2}_\d{2}_vault-answer_'
    target: trace
  # The skill retries the answerer at most once, for citation density.
  - name: answerer-dispatched-at-most-twice
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?vault-query-answerer"'
    min: 1
    max: 2
  # The wikilink exists only in answer.md, whose Write input and Read result both land in the trace.
  - name: cites-the-flashcard-note
    type: regex
    pattern: '\[\[Retrieval practice beat rereading\]\]'
    target: trace
  - name: unrelated-note-not-cited
    type: regex
    pattern: '\[\[Sourdough'
    match: not_contains
    target: trace
  # The seed notes hold no interval, so the gap has to be named under Unknowns; the prompt's own template bullet never mentions one.
  - name: interval-listed-under-unknowns
    type: regex
    pattern: '## Unknowns[\s\S]{0,40}- [^\n]{0,300}?(?:interval|schedule)'
    flags: i
    target: trace
  # The seed notes hold no day or week count either, so one in the trace was supplied from general knowledge.
  - name: interval-not-invented
    type: regex
    pattern: '\b\d+[- ]?(?:days?|weeks?)\b'
    flags: i
    match: not_contains
    target: trace
  - name: retrieval-note-intact
    type: regex
    pattern: 'the 120 cards I quizzed myself on were still remembered at 82%'
    target: { source: file, path: "04 - Permanent/Retrieval practice beat rereading.md" }
  - name: retrieval-note-untouched
    type: regex
    pattern: '\[\[|## (?:Sources|Unknowns)|^# Answer$'
    flags: m
    match: not_contains
    target: { source: file, path: "04 - Permanent/Retrieval practice beat rereading.md" }
  - name: spaced-note-intact
    type: regex
    pattern: 'schedules each review just before the memory would fade'
    target: { source: file, path: "04 - Permanent/Spaced repetition widens the gaps between reviews.md" }
  - name: spaced-note-untouched
    type: regex
    pattern: '\[\[|## (?:Sources|Unknowns)|^# Answer$'
    flags: m
    match: not_contains
    target: { source: file, path: "04 - Permanent/Spaced repetition widens the gaps between reviews.md" }
  - name: sourdough-note-intact
    type: regex
    pattern: 'At 75% hydration my sourdough crumb is open'
    target: { source: file, path: "inbox/Sourdough hydration.md" }
  - name: sourdough-note-untouched
    type: regex
    pattern: '\[\[|## (?:Sources|Unknowns)|^# Answer$'
    flags: m
    match: not_contains
    target: { source: file, path: "inbox/Sourdough hydration.md" }
  # Only files under .mz/ may be created. The created-files list left out .mz/ paths in some runs, so the state check is a Write call.
  - name: task-state-created
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/\.mz/task/[^"]*/state\.md"'
  - name: nothing-created-outside-mz
    type: regex
    pattern: '^(?!(?:.*/)?\.mz/).+'
    flags: m
    match: not_contains
    target: files
  - name: no-vault-write
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*/\.mz/)[^"]*\.(?:md|base|yml)"'
    min: 0
    max: 0
  - name: no-vault-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?![^"]*/\.mz/)[^"]*\.(?:md|base|yml)"'
    min: 0
    max: 0
