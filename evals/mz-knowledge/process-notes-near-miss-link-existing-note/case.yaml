schema_version: "1.1"
name: process-notes-near-miss-link-existing-note
description: Finding which existing notes a finished note should link to is link discovery, so it belongs to vault-connect.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
execution:
  prompt: >-
    notes/Retrieval practice beats rereading.md has no outgoing links at all.
    Which of my other notes should it connect to?
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: process-notes-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?process-notes"'
    min: 0
    max: 0
    arm: both
  - name: vault-connect-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-connect"'
