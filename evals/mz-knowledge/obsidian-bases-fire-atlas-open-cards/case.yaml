schema_version: "1.1"
name: obsidian-bases-fire-atlas-open-cards
description: A self-updating, grouped cards layout over a folder of notes with core Obsidian only is a Bases database view, described without its vocabulary.
tags: [routing, fire, held-out]
plugins: ["../../../plugins/mz-knowledge", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe"]
execution:
  prompt: >-
    Projects/Atlas/ has around forty notes, each with status, owner and due in the
    properties. I want a page I can open in Obsidian that shows only the ones that
    aren't done, laid out as cards grouped by owner, soonest due date first. It
    should update by itself when I change a note, and I don't want any community
    plugins for it.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: obsidian-bases-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?obsidian-bases"'
