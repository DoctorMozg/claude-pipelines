schema_version: "1.1"
name: init-rules-near-miss-claudemd-one-line
description: Swapping one command line in an existing CLAUDE.md is a trivial edit that needs no skill, not a rules install.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-rules", "../../../plugins/mz-base", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-dev-git", "../../../plugins/mz-knowledge"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    Quick one. The CLAUDE.md in the repo root has a Build section, and the first
    command under it is still npm run build from before we moved to pnpm. Swap that
    one line to pnpm build and leave everything else in the file alone.
  # The right move is the job itself, so the session has the file and the tools for it; a skill call still fails the case.
  allowed_tools: [Skill, Read, Grep, Glob, Edit]
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: init-rules-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?init-rules"'
    min: 0
    max: 0
    arm: both
  - name: command-swapped
    type: regex
    pattern: '`pnpm build` builds the production bundle'
    target: { source: file, path: "CLAUDE.md" }
  - name: rest-untouched
    type: regex
    pattern: '`pnpm test` runs the unit tests\.\n- `pnpm lint` runs ESLint\.'
    target: { source: file, path: "CLAUDE.md" }
