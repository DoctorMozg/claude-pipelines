schema_version: "1.1"
name: audit-fire-security-review
description: A security review plus bug hunt across a whole repo, with findings reported and no code changes, is an audit.
tags: [routing, fire]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
execution:
  prompt: >-
    We ship the new payments service next week. Can you do a security review of the
    whole repo and look for bugs while you're at it? I want a ranked list of what you
    find. Please don't change any code.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: audit-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?audit"'
