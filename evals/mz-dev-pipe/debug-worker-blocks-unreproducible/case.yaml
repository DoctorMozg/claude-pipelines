schema_version: "1.1"
name: debug-worker-blocks-unreproducible
description: 'A worker brief reports a failure the suite does not reproduce. Debug in worker mode must not ask the user: it records the blocker in state and ends with STATUS: BLOCKED, editing nothing outside .mz.'
tags: [worker, track-d, needs-bash]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-dev-pipe:debug unit:units/WU-2.md
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep, Bash, AskUserQuestion]
  max_turns: 40
  timeout_seconds: 900
graders:
  # A slash prompt loads the skill without a Skill call, so the state file only the skill writes proves it ran.
  - name: debug-ran
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_debug_[a-z0-9_]+/state\.md'
    target: trace
  - name: worker-mode-recorded
    type: regex
    pattern: '_debug_[a-z0-9_]+/state\.md[^\n]*unattended: worker'
    target: trace
  - name: never-asks-the-user
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
  - name: ends-with-status-blocked
    type: regex
    pattern: '"role":"assistant","content":\[\{"type":"text","text":"(?=[^\n]*STATUS: BLOCKED)[^\n]*"parent_tool_use_id":null'
    target: trace
  # The orchestrator's worker commits; the skill itself never does.
  - name: no-commit
    type: tool_used
    tool: Bash
    input_match: 'git\s+(?:-\S+\s+\S+\s+)*commit'
    min: 0
    max: 0
  # Lint and test runs leave tool caches on disk, which count as file changes but aren't edits.
  - name: no-edit-outside-owns
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?![^"]*(?:\.mz/|\.(?:ruff|pytest|mypy)_cache/|__pycache__/|tests/test_pricing\.py))'
    min: 0
    max: 0
  - name: no-write-outside-owns
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*(?:\.mz/|\.(?:ruff|pytest|mypy)_cache/|__pycache__/|tests/test_pricing\.py))'
    min: 0
    max: 0
  - name: blocker-in-state
    type: regex
    pattern: '_debug_[a-z0-9_]+/state\.md[^\n]*Status: blocked'
    target: trace
  - name: source-untouched
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*shop/pricing\.py'
    min: 0
    max: 0
