schema_version: "1.1"
name: tooling-context-guides-model
description: 'Asked for the install command, the model reads tooling.json, which the SessionStart context points to, and answers correctly.'
tags: [hooks, tooling]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    What is the exact command to install this project's dependencies? Reply with just the
    command.
  allowed_tools: [Read]
  max_turns: 4
  timeout_seconds: 180
graders:
  - name: answer-is-poetry
    type: regex
    pattern: '\bpoetry install\b'
  - name: read-tooling-json
    type: tool_used
    tool: Read
    input_match: 'tooling\.json'
  - name: hook-announced-python
    type: regex
    pattern: '"subtype":"hook_response"[^\n]*Project tooling detected: python'
    target: trace
