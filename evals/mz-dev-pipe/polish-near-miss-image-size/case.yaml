schema_version: "1.1"
name: polish-near-miss-image-size
description: Shrinking a container image to a size target is a measurable size optimization, so it belongs to optimize, not polish.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
execution:
  prompt: >-
    The Docker image for our API service is 1.4GB, which makes every deploy crawl.
    Bring it under 300MB. Multi-stage build, a slimmer base image, whatever works.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: polish-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?polish"'
    min: 0
    max: 0
    arm: both
  - name: optimize-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?optimize"'
