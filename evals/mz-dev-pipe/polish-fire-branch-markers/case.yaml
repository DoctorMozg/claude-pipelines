schema_version: "1.1"
name: polish-fire-branch-markers
description: Phase markers, generation signatures and half-built stubs left by an AI run across a branch are a polish residue criterion.
tags: [routing, fire]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base", "../../../plugins/mz-creative"]
execution:
  prompt: >-
    I ran the full build pipeline on my feature branch and it left junk all over
    the code. Phase 1 and Phase 2 comments everywhere, "Generated by Claude" lines
    at the top of files, and a few half-implemented stub functions. Clean the
    leftovers off before I send it for review.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: polish-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?polish"'
