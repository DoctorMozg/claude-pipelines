schema_version: "1.1"
name: debug-behavior-question-review
description: 'Given a bug unit whose fix can reuse a rounding helper or round inline, debug runs question review in its Phase 5 code review as a worker: the questioner and answerer are dispatched, and the questions and grades land in the task question_review/ folder.'
tags: [behavior, worker, track-d, needs-bash]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-dev-pipe:debug unit:units/WU-2.md
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep, Bash, AskUserQuestion]
  max_turns: 100
  timeout_seconds: 1800
graders:
  # A slash prompt loads the skill without a Skill call, so the state file only the skill writes proves it ran.
  - name: debug-ran
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_debug_[a-z0-9_]+/state\.md'
    target: trace
  - name: never-asks-the-user
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
  # Anchored on subagent_type: a bare agent name also matches prompt text that only mentions it.
  - name: questioner-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-design-questioner"'
    min: 1
  - name: answerer-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-design-answerer"'
    min: 1
  - name: questions-written
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_debug_[a-z0-9_]+/question_review/questions\.md'
    target: trace
  - name: grades-written
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_debug_[a-z0-9_]+/question_review/grades\.md'
    target: trace
  - name: ends-with-status-done
    type: regex
    pattern: '"role":"assistant","content":\[\{"type":"text","text":"(?=[^\n]*STATUS: DONE)[^\n]*"parent_tool_use_id":null'
    target: trace
