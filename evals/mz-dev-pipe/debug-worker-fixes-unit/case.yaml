schema_version: "1.1"
name: debug-worker-fixes-unit
description: 'Given a unit brief from mz-orchestrate, debug runs unattended as a worker: it auto-approves its diagnosis gate on the DAG gate authority, fixes the bug inside the owned files, adds a regression test and ends with a STATUS line, never asking the user or committing.'
tags: [worker, track-d, needs-bash]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-dev-pipe:debug unit:units/WU-1.md
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep, Bash, AskUserQuestion]
  max_turns: 80
  timeout_seconds: 1500
graders:
  # A slash prompt loads the skill without a Skill call, so the state file only the skill writes proves it ran.
  - name: debug-ran
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_debug_[a-z0-9_]+/state\.md'
    target: trace
  - name: worker-mode-recorded
    type: regex
    pattern: '_debug_[a-z0-9_]+/state\.md[^\n]*unattended: worker'
    target: trace
  - name: never-asks-the-user
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
  - name: ends-with-status-done
    type: regex
    pattern: '"role":"assistant","content":\[\{"type":"text","text":"(?=[^\n]*STATUS: DONE)[^\n]*"parent_tool_use_id":null'
    target: trace
  # The orchestrator's worker commits; the skill itself never does.
  - name: no-commit
    type: tool_used
    tool: Bash
    input_match: 'git\s+(?:-\S+\s+\S+\s+)*commit'
    min: 0
    max: 0
  - name: no-edit-outside-owns
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?![^"]*(?:\.mz/|shop/pricing\.py|tests/test_pricing\.py))'
    min: 0
    max: 0
  - name: no-write-outside-owns
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*(?:\.mz/|shop/pricing\.py|tests/test_pricing\.py))'
    min: 0
    max: 0
  # The skill text names the authority with a placeholder; only the model's own state or journal write carries the real unit id.
  - name: gate-auto-approved-as-worker
    type: regex
    pattern: 'mz-orchestrate DAG gate, unit WU-1'
    target: trace
  # At least one test beyond the fixture's two, however many the fix adds.
  - name: regression-test-added
    type: regex
    pattern: 'def test_[\s\S]*def test_[\s\S]*def test_'
    target: { source: file, path: tests/test_pricing.py }
  # Worker mode answers the gates; it doesn't shrink the pipeline into an inline edit.
  - name: pipeline-agents-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-(?:test-writer|coder|code-reviewer)"'
    min: 1
