schema_version: "1.1"
name: optimize-fire-tokenizer-speedup
description: Asking for a code path to be optimized against a numeric speed target is the core optimize request.
tags: [routing, fire]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
execution:
  prompt: >-
    Can you optimize the tokenizer in src/parser/tokenizer.py? A 10k-line file takes
    about 45ms right now and I want it at least 2x faster.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: optimize-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?optimize"'
