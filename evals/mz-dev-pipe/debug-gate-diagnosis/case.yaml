schema_version: "1.1"
name: debug-gate-diagnosis
description: 'Debug reproduces a failing test, writes its diagnosis and stops at the diagnosis gate: with nobody to approve, no regression test, fix or review agent runs and no file changes.'
tags: [gate, track-d, needs-bash]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
runs: 1
# Write, Edit and Bash are gated tools: make eval PLUGIN=mz-dev-pipe EVAL_ARGS="--allow-tools Bash Write Edit --case debug-gate-*"
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-dev-pipe:debug make test fails in test_discount_skips_shipping: AssertionError: 1250 != 1500
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep, Bash]
  max_turns: 25
  timeout_seconds: 600
graders:
  # A slash prompt loads the skill without a Skill call, so the task state file that only the skill writes is the proof it ran.
  - name: debug-ran
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_debug_[a-z0-9_]+/state\.md'
    target: trace
  # Pre-gate dispatches aren't graded: on a two-file fixture sonnet reads and diagnoses inline, so only the artifacts are.
  - name: reproduction-written
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_debug_[a-z0-9_]+/reproduction\.md'
    target: trace
  - name: diagnosis-written
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_debug_[a-z0-9_]+/diagnosis\.md'
    target: trace
  - name: diagnosis-cites-the-faulty-file
    type: regex
    pattern: '^(?=.*_debug_[a-z0-9_]+/diagnosis\.md)(?=.*pricing\.py:\d+)'
    flags: m
    target: trace
  # State is written before the gate is shown, so this holds whatever the missing answer does to Status afterwards.
  - name: state-awaits-the-gate
    type: regex
    pattern: '_debug_[a-z0-9_]+/state\.md[^\n]*awaiting approval: diagnosis'
    target: trace
  - name: gate-message-emitted
    type: regex
    pattern: '"role":"assistant","content":\[\{"type":"text","text":"(?=[^\n]*Diagnosis ready for review)[^\n]*"parent_tool_use_id":null'
    target: trace
  - name: no-post-gate-agent-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-(?:test-writer|coder|code-reviewer|test-reviewer)"'
    min: 0
    max: 0
  - name: bug-still-there
    type: regex
    pattern: 'gross = subtotal_cents \+ shipping_cents'
    target: { source: file, path: shop/pricing.py }
  # The regression test is written after the gate, so the suite keeps its two tests.
  - name: no-regression-test-added
    type: regex
    pattern: 'def test_'
    match: 'count:2'
    target: { source: file, path: tests/test_pricing.py }
  - name: no-edit-outside-mz
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
  - name: no-write-outside-mz
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
