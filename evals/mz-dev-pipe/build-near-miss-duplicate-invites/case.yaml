schema_version: "1.1"
name: build-near-miss-duplicate-invites
description: A reported defect in a shipped feature is a bug fix in existing code, so it belongs to debug instead of build.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
execution:
  prompt: >-
    The bulk invite feature we shipped last sprint is sending duplicate emails whenever the same address shows up twice in one uploaded CSV. I think it is somewhere in invite/bulk_invite.py. Can you track it down and fix it?
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: build-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?build"'
    min: 0
    max: 0
    arm: both
  - name: debug-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?debug"'
