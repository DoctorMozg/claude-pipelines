schema_version: "1.1"
name: optimize-args-budget-missing
description: 'A request to make code faster with no metric, unit or target gets BUDGET MISSING and a question: no metric is guessed, no agent is dispatched, no contract is drafted.'
tags: [args, track-d]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
runs: 1
# Write and Edit are gated tools: make eval PLUGIN=mz-dev-pipe EVAL_ARGS="--allow-tools Write Edit --case optimize-args-*"
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-dev-pipe:optimize make src/parser/tokenizer.py faster
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep]
  max_turns: 12
  timeout_seconds: 300
graders:
  # AskUserQuestion isn't available in eval sessions, so the question is asked in chat; the skill's own token proves the skill ran.
  - name: budget-missing-emitted
    type: regex
    pattern: '"role":"assistant","content":\[\{"type":"text","text":"[^\n]*BUDGET MISSING'
    target: trace
  - name: budget-not-declared
    type: regex
    pattern: '"role":"assistant","content":\[\{"type":"text","text":"[^\n]*BUDGET DECLARED'
    match: not_contains
    target: trace
  - name: asks-for-the-metric
    type: regex
    pattern: '"role":"assistant","content":\[\{"type":"text","text":"(?=[^\n]*\bmetric\b)[^\n]*"parent_tool_use_id":null'
    flags: i
    target: trace
  - name: no-agent-dispatched
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: no-contract-drafted
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*contract\.md"'
    min: 0
    max: 0
  - name: source-intact
    type: regex
    pattern: 'tokens = tokens \+ \[match\.group\(\)\.strip\(\)\]'
    target: { source: file, path: src/parser/tokenizer.py }
  - name: no-edit-outside-mz
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
  - name: no-write-outside-mz
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
