schema_version: "1.1"
name: tooling-hostile-manifest
description: 'Text from an attacker-controlled package.json never reaches tooling.json: commands come only from fixed strings.'
tags: [hooks, tooling]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    Reply with just OK.
  allowed_tools: []
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: javascript-detected
    type: regex
    pattern: '"javascript": \{'
    target: { source: file, path: .mz/tooling.json }
  - name: no-manifest-text
    type: regex
    pattern: 'curl|rm -rf|evil\.example|\$\(|`'
    match: not_contains
    target: { source: file, path: .mz/tooling.json }
  - name: hook-announced-javascript
    type: regex
    pattern: '"subtype":"hook_response"[^\n]*Project tooling detected: javascript'
    target: trace
