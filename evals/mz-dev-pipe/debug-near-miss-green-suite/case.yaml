schema_version: "1.1"
name: debug-near-miss-green-suite
description: Getting the whole suite and linters to a stated bar, with no single bug in view, belongs to polish.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
execution:
  prompt: >-
    I'm cutting a release tomorrow. Before I tag it I need everything in tests/
    passing, ruff and mypy clean on the whole repo, and coverage at 85 percent or
    higher. Whatever it takes to get there.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: debug-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?debug"'
    min: 0
    max: 0
    arm: both
  - name: polish-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?polish"'
