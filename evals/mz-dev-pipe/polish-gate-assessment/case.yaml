schema_version: "1.1"
name: polish-gate-assessment
description: 'Polish assesses a failing suite, shows the assessment at its first gate and stops: with nobody to approve, no quick fix, test or coder agent touches the code.'
tags: [gate, track-d, needs-bash]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
runs: 1
# Write, Edit and Bash are gated tools: make eval PLUGIN=mz-dev-pipe EVAL_ARGS="--allow-tools Bash Write Edit --case polish-gate-*"
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-dev-pipe:polish all tests in tests/ pass
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep, Bash]
  max_turns: 25
  timeout_seconds: 480
graders:
  # A slash prompt loads the skill without a Skill call, so the task state file that only the skill writes is the proof it ran.
  - name: polish-ran
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_polish_[a-z0-9_]+/state\.md'
    target: trace
  - name: assessment-written
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_polish_[a-z0-9_]+/assessment\.md'
    target: trace
  - name: assessment-names-the-failing-test
    type: regex
    pattern: '^(?=.*_polish_[a-z0-9_]+/assessment\.md)(?=.*test_fractional_mean)'
    flags: m
    target: trace
  # State is written before the gate is shown, so this holds whatever the missing answer does to Status afterwards.
  - name: state-awaits-the-gate
    type: regex
    pattern: '_polish_[a-z0-9_]+/state\.md[^\n]*awaiting approval: assessment'
    target: trace
  - name: gate-message-emitted
    type: regex
    pattern: '"role":"assistant","content":\[\{"type":"text","text":"(?=[^\n]*Assessment ready for review)[^\n]*"parent_tool_use_id":null'
    target: trace
  - name: no-post-gate-agent-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-(?:coder|test-writer|code-reviewer|optimizer)"'
    min: 0
    max: 0
  # Quick fixes run after the gate, so the unused import and the floor division must both survive.
  - name: bug-still-there
    type: regex
    pattern: 'sum\(values\) // len\(values\)'
    target: { source: file, path: calc.py }
  - name: unused-import-still-there
    type: regex
    pattern: '^import os$'
    flags: m
    target: { source: file, path: calc.py }
  - name: no-new-test-added
    type: regex
    pattern: 'def test_'
    match: 'count:3'
    target: { source: file, path: tests/test_calc.py }
  - name: no-edit-outside-mz
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
  - name: no-write-outside-mz
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
