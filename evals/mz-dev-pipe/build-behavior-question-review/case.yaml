schema_version: "1.1"
name: build-behavior-question-review
description: 'Given a feature unit whose spec invites hand-rolling a retry loop next to an existing helper, build runs question review in its Phase 7 code review: the coders write decisions.md, the questioner and answerer are dispatched, and the questions and grades land in the task question_review/ folder.'
tags: [behavior, worker, track-d, needs-bash]
plugins: ["../../../plugins/mz-dev-pipe", "../../../plugins/mz-base"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-dev-pipe:build unit:units/WU-7.md
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep, Bash, AskUserQuestion]
  max_turns: 170
  timeout_seconds: 2700
graders:
  # A slash prompt loads the skill without a Skill call, so the state file only the skill writes proves it ran.
  - name: build-ran
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_build_[a-z0-9_]+/state\.md'
    target: trace
  - name: never-asks-the-user
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
  # Anchored on subagent_type: a bare agent name also matches prompt text that only mentions it.
  - name: questioner-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-design-questioner"'
    min: 1
  - name: answerer-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-design-answerer"'
    min: 1
  - name: questions-written
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_build_[a-z0-9_]+/question_review/questions\.md'
    target: trace
  - name: grades-written
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_build_[a-z0-9_]+/question_review/grades\.md'
    target: trace
  # The first coder creates the file and later ones edit it; either result proves a coder recorded its choices.
  - name: decisions-written
    type: regex
    pattern: '(?:File created successfully at:|The file) \S*\.mz/task/\d{4}_\d{2}_\d{2}_build_[a-z0-9_]+/decisions\.md'
    target: trace
  - name: helper-written
    type: regex
    pattern: 'def fetch_rates\('
    target: { source: file, path: shop/rates.py }
  - name: ends-with-status-done
    type: regex
    pattern: '"role":"assistant","content":\[\{"type":"text","text":"(?=[^\n]*STATUS: DONE)[^\n]*"parent_tool_use_id":null'
    target: trace
