schema_version: "1.1"
name: gov-init-gate-install-no-answer
description: 'gov-init shows the governance block it would append to CLAUDE.md and stops at the change gate, because nobody can answer: CLAUDE.md stays byte for byte as it was.'
tags: [track-d, gate]
plugins: ["../../../plugins/mz-gov"]
runs: 1
context:
  scaffold_script: fixture.sh
# Write is a gated tool: make eval PLUGIN=mz-gov EVAL_ARGS="--allow-tools Write Edit --case 'gov-init-gate-*'"
execution:
  prompt: >-
    /mz-gov:gov-init
  allowed_tools: [Skill, Read, Write, Edit, Glob, Grep]
  max_turns: 15
  timeout_seconds: 300
graders:
  # A slash prompt loads the skill without a Skill call, so look for the task folder only the skill writes.
  - name: gov-init-ran
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/\.mz/task/\d{4}_\d{2}_\d{2}_gov[-_]init_[^"]*/state\.md"'
  # The state write names the gate; matching only tool_use lines keeps the phase file's own text in Read results out.
  - name: state-awaits-change-gate
    type: regex
    pattern: '"name":"(?:Write|Edit)","input":\{[^\n]*awaiting approval: change gate'
    target: trace
  # AskUserQuestion isn't available in eval sessions, so the gate is asked in chat and the plan message carries the sentinel block.
  - name: plan-message-has-the-sentinel-block
    type: regex
    pattern: '"type":"text","text":"[^\n]*<!-- mz-gov:governance-policy v=\S+ start -->'
    target: trace
  - name: approval-asked-in-chat
    type: regex
    pattern: '\bapprove\b'
    flags: i
  - name: claude-md-not-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/CLAUDE\.md"'
    min: 0
    max: 0
  - name: claude-md-not-edited
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*/CLAUDE\.md"'
    min: 0
    max: 0
  - name: user-rules-intact
    type: regex
    pattern: '^# Acme Billing house rules\s+- Run `make test` before every push\.\s+- Money is stored as integer cents\.\s*$'
    target: { source: file, path: CLAUDE.md }
  - name: no-policy-block-in-claude-md
    type: regex
    pattern: 'mz-gov:governance-policy'
    match: not_contains
    target: { source: file, path: CLAUDE.md }
