schema_version: "1.1"
name: govern-behavior-build-routes-design
description: 'A decision already made that needs its build specified is a design doc: the run reads the design-doc template, never the RFD one, runs the heavy panel, and writes nothing to docs/ without a sign-off.'
tags: [behavior, routing-type]
plugins: ["../../../plugins/mz-gov", "../../../plugins/mz-base"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-gov:govern we decided to move the webhook signature checks out of webhooks/handlers.py into one middleware in webhooks/app.py; I need the build spec: where the middleware sits, how it finds each provider's secret and header, and what it returns on a bad signature
  # No AskUserQuestion: the interview falls back to assumptions and the sign-off gate can't pass.
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep]
  max_turns: 90
  timeout_seconds: 2400
graders:
  - name: govern-ran
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/\.mz/task/\d{4}_\d{2}_\d{2}_govern_[^"]*/state\.md"'
  # The Phase 1 screen and the Phase 2 routing.
  - name: router-screens-then-routes
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?gov-router"'
    min: 2
    max: 4
  - name: brief-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/\.mz/task/[^"]*/brief\.md"'
  - name: code-researched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-researcher"'
    min: 1
  - name: research-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/\.mz/task/[^"]*/research\.md"'
  # Phase 2 reads only the template the router picked.
  - name: design-template-read
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*/references/design-doc-template\.md"'
    min: 1
  - name: rfd-template-not-read
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*/references/rfd-template\.md"'
    min: 0
    max: 0
  - name: draft-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/\.mz/task/[^"]*/draft\.md"'
  - name: heavy-panel-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?gov-critic-alternatives"'
    min: 1
  # Nobody can sign off in a headless run, so no durable record is written.
  - name: no-artifact-writer
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?gov-artifact-writer"'
    min: 0
    max: 0
  - name: nothing-written-outside-mz
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*/\.mz/)'
    min: 0
    max: 0
