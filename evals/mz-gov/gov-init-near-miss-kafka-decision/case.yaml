schema_version: "1.1"
name: gov-init-near-miss-kafka-decision
description: Weighing a hard-to-reverse architecture choice and recording it as an ADR is a decision for govern, not a policy install.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-gov", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-dev-git", "../../../plugins/mz-base"]
execution:
  prompt: >-
    We're debating whether the notifications service should keep publishing to the
    shared Kafka topic or get its own queue. Three teams read from that topic today,
    so moving off it is close to a one-way door. Walk me through the options, argue
    against whichever one looks best, and write up the decision as an ADR once I've
    picked.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: gov-init-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gov-init"'
    min: 0
    max: 0
    arm: both
  - name: govern-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?govern"'
