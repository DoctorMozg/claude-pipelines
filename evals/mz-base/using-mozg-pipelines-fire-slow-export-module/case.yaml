schema_version: "1.1"
name: using-mozg-pipelines-fire-slow-export-module
description: A user who cannot tell which of their installed tools suits a slow, buggy, messy file needs the router to map the work to the right ones.
tags: [routing, fire, held-out]
plugins: ["../../../plugins/mz-base", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-dev-git", "../../../plugins/mz-knowledge"]
execution:
  prompt: >-
    I need to deal with services/billing/invoice_export.py. It is slow, I suspect it
    has a bug or two, and the code is ugly. I have a bunch of tools set up here for
    this kind of work but I can't remember which does what. Which ones should I use
    for this file, and in what order?
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: using-mozg-pipelines-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?using-mozg-pipelines"'
