schema_version: "1.1"
name: using-mozg-pipelines-fire-branch-before-pr
description: Asking which of several candidates fits a pre-PR check, in the skill's own wording, is the core router request.
tags: [routing, fire]
plugins: ["../../../plugins/mz-base", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-dev-git", "../../../plugins/mz-knowledge"]
execution:
  prompt: >-
    Which pipeline fits for getting my branch checked before I open the PR? I've got
    too many plugins to keep straight.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: using-mozg-pipelines-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?using-mozg-pipelines"'
