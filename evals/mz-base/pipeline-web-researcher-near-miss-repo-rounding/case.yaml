schema_version: "1.1"
name: pipeline-web-researcher-near-miss-repo-rounding
description: A question about what a named file in the repository does is answered from the code, so it goes to Explore or is answered inline, never to web research.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-base", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-dev-git", "../../../plugins/mz-knowledge"]
execution:
  prompt: >-
    In this repo, which function in src/billing/invoice.py rounds the tax
    amount, and does it round half up or half to even?
  allowed_tools: [Agent]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: web-researcher-not-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-web-researcher"'
    min: 0
    max: 0
    arm: both
