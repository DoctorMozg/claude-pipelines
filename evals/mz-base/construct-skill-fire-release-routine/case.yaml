schema_version: "1.1"
name: construct-skill-fire-release-routine
description: Capturing a repeated manual release routine as a runnable entry under plugins/mz-dev-git is authoring a new marketplace skill, even though the request never uses the word.
tags: [routing, fire, held-out]
plugins: ["../../../plugins/mz-base", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-dev-git", "../../../plugins/mz-knowledge"]
execution:
  prompt: >-
    Each release I do the same thing by hand. List the PRs merged since the last
    tag, bucket them by label, draft the notes, and call out anything labelled
    breaking. I want that captured under plugins/mz-dev-git so anyone who installs
    this marketplace can run it by name. Build it the way its neighbours there are
    built, and make sure it passes our authoring rules before I merge.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: construct-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?construct-skill"'
