schema_version: "1.1"
name: construct-skill-fire-themes-report
description: A direct request to write a new skill for a named plugin in this marketplace repo belongs to construct-skill.
tags: [routing, fire]
plugins: ["../../../plugins/mz-base", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-dev-git", "../../../plugins/mz-knowledge"]
execution:
  prompt: >-
    Write a new skill for the mz-research-pipe plugin that turns a folder of
    interview transcripts into a themes report. Draft the SKILL.md and phase
    files to our guidelines.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: construct-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?construct-skill"'
