schema_version: "1.1"
name: do-roast-near-miss-no-mercy-audit
description: A ranked, report-only hunt for bugs and security holes across src is a serious audit, so it belongs to audit, not a roast.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-funny", "../../../plugins/mz-dev-git", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-research-pipe", "../../../plugins/mz-base"]
execution:
  prompt: >-
    No mercy: go through src/ and find every bug, security hole and ugly hack,
    worst first. Report only, don't touch anything.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: do-roast-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?do-roast"'
    min: 0
    max: 0
    arm: both
  - name: audit-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?audit"'
