schema_version: "1.1"
name: do-roast-near-miss-haunted-architecture
description: A joking aside does not change that the user needs a serious, diagram-backed explanation of how a subsystem is layered and where it is fragile, which belongs to explain.
tags: [routing, near-miss]
plugins: ["../../../plugins/mz-funny", "../../../plugins/mz-dev-git", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-research-pipe", "../../../plugins/mz-base"]
execution:
  prompt: >-
    The notification subsystem in this repo is a haunted house of abstractions and
    honestly kind of hilarious, but I have to extend it next week. Seriously though,
    walk me through how it's layered, draw the main flows, and tell me where the
    design is fragile.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: do-roast-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?do-roast"'
    min: 0
    max: 0
    arm: both
  - name: explain-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?explain"'
