schema_version: "1.1"
name: do-roast-args-unknown-persona
description: 'A persona outside the allowlist stops do-roast in setup: it lists the seven valid personas and starts no analysis, agent or file.'
tags: [track-d, args]
plugins: ["../../../plugins/mz-funny"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-funny:do-roast shakespeare src/billing.py
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep]
  max_turns: 8
  timeout_seconds: 300
graders:
  # Only the skill's allowlist names all seven personas, so listing them proves setup ran and stopped there.
  - name: reply-lists-all-personas
    type: regex
    pattern: '^(?=[\s\S]*caveman)(?=[\s\S]*wh40k-ork)(?=[\s\S]*pirate)(?=[\s\S]*viking)(?=[\s\S]*dwarf)(?=[\s\S]*drill-sergeant)(?=[\s\S]*yoda)'
    flags: i
  - name: reply-names-the-rejected-persona
    type: regex
    pattern: 'shakespeare'
    flags: i
  - name: no-persona-dispatched
    type: tool_used
    tool: Agent
    input_match: '"prompt"'
    min: 0
    max: 0
  # state.md and the dossier come only after the persona is validated.
  - name: nothing-written
    type: tool_used
    tool: Write
    input_match: '"file_path"'
    min: 0
    max: 0
  - name: source-untouched
    type: regex
    pattern: 'return sum\(item\["price"\] \* item\["qty"\] for item in items\)'
    target: { source: file, path: src/billing.py }
