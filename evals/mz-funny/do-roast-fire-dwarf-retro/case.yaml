schema_version: "1.1"
name: do-roast-fire-dwarf-retro
description: A comic-relief rant in a fantasy voice about the shoddiest parts of the codebase, anchored in real problems, belongs to do-roast without any path or trigger phrase.
tags: [routing, fire, held-out]
plugins: ["../../../plugins/mz-funny", "../../../plugins/mz-dev-git", "../../../plugins/mz-dev-pipe", "../../../plugins/mz-research-pipe", "../../../plugins/mz-base"]
execution:
  prompt: >-
    Friday's retro needs some comic relief. Get a grumpy dwarf to rant about the
    shoddiest craftsmanship in our codebase. The jokes have to point at real
    problems though.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: do-roast-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?do-roast"'
