schema_version: "1.1"
name: outreach-enrich-company-fire-gaps-in-file
description: A request to fill the gaps in an existing saved company file and then write a note per listed contact belongs to outreach-enrich-company without using its trigger phrases.
tags: [routing, fire, held-out]
plugins: ["../../../plugins/mz-biz-outreach", "../../../plugins/mz-creative", "../../../plugins/mz-base", "../../../plugins/mz-job-outreach"]
execution:
  prompt: >-
    The file .mz/outreach/active/2026-10-27_nordlicht-robotics.md is pretty bare on what
    Nordlicht has been up to lately. Look up their recent news, what they build with, how
    fast they're growing and what employees and customers say about them, and add all of
    that to the same file. Then write a short personal note for each person it lists as a
    contact. I'll be sending them this week, so they should sound like me and not like a
    mail merge.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: outreach-enrich-company-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?outreach-enrich-company"'
