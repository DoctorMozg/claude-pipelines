schema_version: "1.1"
name: outreach-update-card-behavior-baseline-to-active
description: 'Logging a touch on a never-activated research baseline writes one dated active card with a new Interaction History after the footer, and leaves every other card untouched.'
tags: [track-d, behavior, needs-bash]
plugins: ["../../../plugins/mz-biz-outreach", "../../../plugins/mz-creative", "../../../plugins/mz-base"]
# Bash is a gated tool: make eval PLUGIN=mz-biz-outreach EVAL_ARGS="--allow-tools Write Bash --case outreach-update-card-behavior-*"
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-biz-outreach:outreach-update-card .mz/outreach/2026_10_28_outreach_research_logistics/companies/brightline-logistics.md "Sent intro email re: Fleet-Telemetry pilot (v2)"
  allowed_tools: [Read, Write, Bash]
  max_turns: 20
  timeout_seconds: 420
graders:
  # A slash prompt loads the skill without a Skill call, so the date command is the proof that Step 4 ran.
  - name: date-taken-from-the-shell
    type: tool_used
    tool: Bash
    input_match: 'date\s+(?:\\?["''])?\+%Y-%m-%d'
  # \1 ties the entry date to the filename date; the footer must sit directly above the new section, and the bullet is verbatim with no added period.
  - name: active-card-has-new-section-after-footer
    type: tool_used
    tool: Write
    input_match: '^(?=[\s\S]*"file_path"\s*:\s*"(?:[^"]*/)?\.mz/outreach/active/(\d{4}-\d{2}-\d{2})_brightline-logistics\.md")(?=[\s\S]*Sources: Brightline site, LinkedIn\*\\n\\n## Interaction History\\n\\n- \*\*\1\*\* (?:—|\\u2014) Sent intro email re: Fleet-Telemetry pilot \(v2\)\\n")'
  - name: original-sections-carried-over
    type: tool_used
    tool: Write
    input_match: '^(?=[\s\S]*\.mz/outreach/active/\d{4}-\d{2}-\d{2}_brightline-logistics\.md)[\s\S]*refrigerated trailers[\s\S]*Priya Nair[\s\S]*peak-season dispatch[\s\S]*## Interaction History'
  - name: exactly-one-write
    type: tool_used
    tool: Write
    min: 1
    max: 1
  - name: report-says-section-is-new
    type: regex
    pattern: 'newly created'
    flags: i
  # Each bystander gets a positive grader (the file is still there, ending as seeded) and a negative one (nothing of this run leaked in).
  - name: fjordline-active-card-intact
    type: regex
    pattern: 'coastal container feeders[\s\S]*## Interaction History\n\n- \*\*2026-10-15\*\* — Called Lars, he wants a demo in two weeks\n$'
    target: { source: file, path: .mz/outreach/active/2026-10-15_fjordline-shipping.md }
  - name: fjordline-active-card-not-touched
    type: regex
    pattern: 'Brightline|Fleet-Telemetry|intro email'
    match: not_contains
    target: { source: file, path: .mz/outreach/active/2026-10-15_fjordline-shipping.md }
  - name: kestrel-baseline-intact
    type: regex
    pattern: 'Kestrel Marine builds aluminium workboats in Aberdeen\.[\s\S]*Generated: 2026-10-28 \| Sources: Kestrel site, LinkedIn\*\n$'
    target: { source: file, path: .mz/outreach/2026_10_28_outreach_research_logistics/companies/kestrel-marine.md }
  - name: kestrel-baseline-not-touched
    type: regex
    pattern: 'Interaction History|Brightline|Fleet-Telemetry'
    match: not_contains
    target: { source: file, path: .mz/outreach/2026_10_28_outreach_research_logistics/companies/kestrel-marine.md }
