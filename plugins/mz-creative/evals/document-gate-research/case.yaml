schema_version: "1.1"
name: document-gate-research
description: 'document researches a small package, shows research.md at the research gate and stops, because nobody can answer: no technical writer or naturalizer runs and no doc is written.'
tags: [track-d, gate]
plugins: ["../..", "../../../mz-base"]
runs: 1
context:
  scaffold_script: fixture.sh
# Write is a gated tool: make eval PLUGIN=mz-creative EVAL_ARGS="--allow-tools Write Edit --case 'document-gate-*'"
execution:
  prompt: >-
    /mz-creative:document write a how-to for loading plugins with src/pluginbox/loader.py type:howto
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep]
  max_turns: 20
  timeout_seconds: 400
graders:
  # A slash prompt loads the skill without a Skill call, so look for the task folder only the skill writes.
  - name: document-ran
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/\.mz/task/\d{4}_\d{2}_\d{2}_document_[^"]*/state\.md"'
  # The two identifiers exist only in the fixture, so a research.md that names them was read from the code.
  - name: research-grounded-in-code
    type: tool_used
    tool: Write
    input_match: '^(?=[\s\S]*"file_path"\s*:\s*"[^"]*/\.mz/task/[^"]*/research\.md")(?=[\s\S]*## Public surface)(?=[\s\S]*discover_manifests)(?=[\s\S]*ManifestError)'
  # The state write names the gate; matching only tool_use lines keeps the skill text in Read results out.
  - name: state-awaits-research-gate
    type: regex
    pattern: '"name":"(?:Write|Edit)","input":\{[^\n]*awaiting approval: research gate'
    target: trace
  # AskUserQuestion isn't available in eval sessions, so the gate is asked in chat and the plan message carries the research itself.
  - name: plan-message-has-the-research
    type: regex
    pattern: '"type":"text","text":"[^\n]*Research ready for review[^\n]*## Public surface'
    target: trace
  - name: approval-asked-in-chat
    type: regex
    pattern: '\bapprove\b'
    flags: i
  - name: writer-and-naturalizer-not-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?expert-(?:technical-writer|naturalizer)"'
    min: 0
    max: 0
  - name: no-doc-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/\.mz/reports/'
    min: 0
    max: 0
  # Nothing but .mz/ gets written before the gate, so the project files stay as seeded.
  - name: nothing-written-outside-mz
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*/\.mz/)'
    min: 0
    max: 0
  - name: source-untouched
    type: regex
    pattern: 'def discover_manifests\(root: Path\) -> list\[dict\]:'
    target: { source: file, path: src/pluginbox/loader.py }
