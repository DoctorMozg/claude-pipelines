schema_version: "1.1"
name: naturalize-fire-personal-essay
description: A stiff, over-polished personal essay in a named file needs its voice restored, which is naturalize even without its trigger phrases.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe", "../../../mz-research-pipe"]
execution:
  prompt: >-
    My essay in applications/gsb/essay1.md is too slick. Every paragraph is the same
    length, it says "tapestry" and "passion" about four times each, and it ends on a
    tidy little moral. It reads like nobody in particular wrote it. Redo it so it has
    an actual voice, but keep my facts and dates as they are and don't invent any
    achievements.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: naturalize-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?naturalize"'
