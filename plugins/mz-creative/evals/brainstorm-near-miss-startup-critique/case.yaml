schema_version: "1.1"
name: brainstorm-near-miss-startup-critique
description: The user already has a startup idea and wants it critiqued, which belongs to expert instead of brainstorm.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    I've got an idea for a startup and I'd like a hard critical look at it before I
    spend my savings. The idea is a subscription box that mails one heirloom
    vegetable seed packet a month, with a QR code to a short grow-along video. Where
    is it strong, where is it weak, and what am I missing? I'd like it looked at
    from the business side, the user-behavior side and the logistics side.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: brainstorm-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?brainstorm"'
    min: 0
    max: 0
    arm: both
