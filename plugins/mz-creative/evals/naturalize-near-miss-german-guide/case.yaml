schema_version: "1.1"
name: naturalize-near-miss-german-guide
description: Turning a guide file into another language is translation, so it belongs to translate and not to a same-language rewrite.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe", "../../../mz-research-pipe"]
execution:
  prompt: >-
    Translate docs/setup-guide.md into German. It should read like a German engineer
    wrote it, not like machine translation, but keep the code blocks and CLI flags
    exactly as they are.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: naturalize-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?naturalize"'
    min: 0
    max: 0
    arm: both
