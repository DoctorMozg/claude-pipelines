schema_version: "1.1"
name: expert-near-miss-docs-ideas
description: The user has decided nothing and asks for creative ideas from different angles, which belongs to brainstorm instead of expert.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    stuck on how to make our open source docs less boring. think about this from
    different angles and throw me some creative ideas, nothing decided yet
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: expert-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?expert"'
    min: 0
    max: 0
    arm: both
  - name: brainstorm-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?brainstorm"'
