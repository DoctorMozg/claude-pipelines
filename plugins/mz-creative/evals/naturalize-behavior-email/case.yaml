schema_version: "1.1"
name: naturalize-behavior-email
description: 'A colleague email where leverage is the finance term and sits on the avoid list; preserve:leverage must keep it, with the figures, while banned punctuation goes.'
tags: [behavior, naturalizer-ab]
plugins: ["../..", "../../../mz-base"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-creative:naturalize preserve:leverage @file:refinancing.md
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep, Bash]
  max_turns: 30
  timeout_seconds: 900
graders:
  # A slash-command prompt loads the skill without a Skill tool call, so look for the task folder only the skill names.
  - name: naturalize-ran
    type: regex
    pattern: '\.mz/task/\d{4}_\d{2}_\d{2}_naturalize_'
    target: trace
  - name: naturalizer-dispatched
    type: tool_used
    tool: Agent
    input_match: 'expert-naturalizer'
  # The fixture keeps banned characters out of code and quotes, so any hit is prose; digit ranges such as 3–5 are allowed.
  - name: no-banned-punctuation
    type: regex
    pattern: '—|;|…|→|←|⇒|(?<![0-9])–|–(?![0-9])'
    match: not_contains
    target: { source: file, path: refinancing.md }
  # 90 to 172 words is −35% to +25% of the input, since cutting filler is the job; it also proves the file exists for the not_contains grader above.
  - name: length-kept
    type: regex
    pattern: '^\s*(?:\S+\s+){89,171}\S+\s*$'
    target: { source: file, path: refinancing.md }
  - name: facts-kept
    type: regex
    pattern: '^(?=[\s\S]*\b[Ll]everage\b)(?=[\s\S]*3\.1x)(?=[\s\S]*€2\.4M)(?=[\s\S]*October 15)'
    target: { source: file, path: refinancing.md }
  # AskUserQuestion isn't available in eval sessions, so a gate would show up as a request in chat.
  - name: approval-not-requested
    type: regex
    pattern: '\bapprove\b'
    flags: i
    match: not_contains
