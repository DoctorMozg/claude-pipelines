schema_version: "1.1"
name: naturalize-near-miss-launch-email
description: Writing a new announcement email from product facts is promotional copy, so it belongs to copywrite even though the user wants it to sound like a person.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe", "../../../mz-research-pipe"]
execution:
  prompt: >-
    We ship Tallyfox 2.0 on Thursday: recurring invoices, a Stripe sync and a
    redesigned dashboard. Write the announcement email to our 4,000 existing customers.
    Friendly, a bit dry, under 200 words. The ones we get from other vendors all sound
    like a robot wrote them, so please don't do that to ours.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: naturalize-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?naturalize"'
    min: 0
    max: 0
    arm: both
