schema_version: "1.1"
name: expert-fire-kafka-migration
description: The user asks for an expert review of a specific migration plan, so expert should handle it.
tags: [routing, fire]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    Can I get an expert review of this plan? We want to replace our nightly cron
    batch jobs with a Kafka streaming pipeline. Team of four, roughly 2 TB a day,
    and nobody on the team has run Kafka in production before.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: expert-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?expert"'
