schema_version: "1.1"
name: polish-fire-unused-code
description: Removing unused imports and dead functions without changing behavior is a polish cleanup criterion.
tags: [routing, fire]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    Can you clean up src/billing/? There are a lot of unused imports and a few
    functions nobody calls anymore. Behavior must stay exactly the same.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: polish-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?polish"'
