schema_version: "1.1"
name: optimize-near-miss-dead-helpers
description: Deleting unused helpers and imports with no behavior change is dead-code removal, so it belongs to cleanup.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    Our repo feels bloated. Remove the dead code and unused imports across src/ so
    the codebase is leaner. Nothing should behave differently afterwards.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: optimize-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?optimize"'
    min: 0
    max: 0
    arm: both
  - name: cleanup-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cleanup"'
