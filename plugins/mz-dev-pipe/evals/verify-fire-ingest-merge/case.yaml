schema_version: "1.1"
name: verify-fire-ingest-merge
description: A request for a green or red snapshot of existing checks after a merge, with no fixing, is verify even without its trigger phrases.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    I just merged a teammate's work into services/ingest/ and haven't looked at it
    yet. Does everything still pass there: tests, linter, mypy? Tell me what's red and
    what's green and I'll sort out the fixes myself.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: verify-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?verify"'
