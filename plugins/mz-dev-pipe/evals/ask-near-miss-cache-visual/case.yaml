schema_version: "1.1"
name: ask-near-miss-cache-visual
description: A how-does-it-work question that explicitly asks for diagrams is a visual walkthrough, which belongs to explain.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-research-pipe", "../../../mz-base"]
execution:
  prompt: >-
    How does cache invalidation work in src/cache/? I'm more of a picture person, so
    give me a visual breakdown with mermaid diagrams.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: ask-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ask"'
    min: 0
    max: 0
    arm: both
  - name: explain-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?explain"'
