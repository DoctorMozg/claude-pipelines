schema_version: "1.1"
name: verify-behavior-no-test-command
description: 'With no test framework detectable, verify asks how to run the tests instead of skipping them, runs no check agent and writes no report.'
tags: [behavior, track-d, needs-bash]
plugins: ["../..", "../../../mz-base"]
runs: 1
# Write, Edit and Bash are gated tools; the detector and every check need Bash: make eval PLUGIN=mz-dev-pipe EVAL_ARGS="--allow-tools Write Edit Bash --case verify-behavior-*"
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-dev-pipe:verify
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep, Bash]
  max_turns: 20
  timeout_seconds: 480
graders:
  # A slash prompt loads the skill without a Skill call, so the task state file that only the skill writes is the proof it ran.
  - name: verify-ran
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_verify_[a-z0-9_]+/state\.md'
    target: trace
  - name: tooling-detector-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-tooling-detector"'
    min: 1
    max: 2
  # Wave 1 of the checks only starts once a test command is known, so none of these may have run.
  - name: no-check-agent-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-(?:test-runner|lint-runner|test-reviewer)"'
    min: 0
    max: 0
  - name: asks-for-a-test-command
    type: regex
    pattern: '"role":"assistant","content":\[\{"type":"text","text":"(?=[^\n]*(?:test command|how (?:do|should|can) (?:i|we) run|run (?:the |your )?tests|test runner|test framework))[^\n]*"parent_tool_use_id":null'
    flags: i
    target: trace
  - name: no-report-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*\.mz/reports/'
    min: 0
    max: 0
  - name: source-intact
    type: regex
    pattern: 'log\.unlink\(\)'
    target: { source: file, path: scripts/rotate_logs.py }
  - name: no-edit-outside-mz
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
  - name: no-write-outside-mz
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
