schema_version: "1.1"
name: ask-fire-rate-limits
description: A hybrid question needing both a codebase lookup and external documentation, answered in prose, is ask.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-research-pipe", "../../../mz-base"]
execution:
  prompt: >-
    I'm trying to pin down where rate limiting for our public API lives and what
    limits it applies. I'm also curious whether those numbers are in line with what
    the GitHub REST API enforces. Nothing to change, I just need the answer and where
    you found it.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: ask-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ask"'
