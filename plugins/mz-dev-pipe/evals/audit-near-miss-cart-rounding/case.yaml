schema_version: "1.1"
name: audit-near-miss-cart-rounding
description: One known, reproducible wrong-total bug to track down and fix belongs to debug, not a codebase-wide audit.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    Cart totals in checkout/cart.py are off by a cent whenever a percentage coupon is
    applied to an item priced with three decimals. I can reproduce it with the cart in
    tests/fixtures/cart_coupon.json. Find the bug and fix it.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: audit-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?audit"'
    min: 0
    max: 0
    arm: both
