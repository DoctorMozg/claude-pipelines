schema_version: "1.1"
name: decomment-near-miss-signatures-stubs
description: Removing generation signatures, phase headers and empty placeholder functions across a branch goes beyond comments, so it belongs to clean-leftovers.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-creative"]
execution:
  prompt: >-
    My coding agent finished the notifications service on this branch. Before I open
    the PR, get rid of the "Generated by" signature lines, the "Phase 2: implement
    handlers" headers, and the empty placeholder functions it never filled in.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: decomment-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?decomment"'
    min: 0
    max: 0
    arm: both
  - name: clean-leftovers-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?clean-leftovers"'
