schema_version: "1.1"
name: audit-args-unknown-focus
description: 'An audit argument that names no lens and no path leaves the lens choice open, so audit asks which lenses to run and dispatches no researcher.'
tags: [args, track-d]
plugins: ["../..", "../../../mz-base"]
runs: 1
# Write and Edit are gated tools: make eval PLUGIN=mz-dev-pipe EVAL_ARGS="--allow-tools Write Edit --case audit-args-*"
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-dev-pipe:audit the thing
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep]
  max_turns: 12
  timeout_seconds: 300
graders:
  # AskUserQuestion isn't available in eval sessions, so the question is asked in chat; lens is the skill's own word for the choice it offers.
  - name: asks-which-lenses
    type: regex
    pattern: '"role":"assistant","content":\[\{"type":"text","text":"(?=[^\n]*(?:\blenses\b|\blens\b|correctness|reliability))[^\n]*"parent_tool_use_id":null'
    flags: i
    target: trace
  - name: no-researcher-dispatched
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: no-findings-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/(?:findings[^"/]*|summary)\.md"'
    min: 0
    max: 0
  - name: source-intact
    type: regex
    pattern: 'WHERE customer_id = ''\{customer_id\}'''
    target: { source: file, path: services/billing/repo.py }
  - name: no-edit-outside-mz
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
  - name: no-write-outside-mz
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
