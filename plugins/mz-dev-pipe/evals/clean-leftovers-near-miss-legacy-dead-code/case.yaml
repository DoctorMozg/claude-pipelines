schema_version: "1.1"
name: clean-leftovers-near-miss-legacy-dead-code
description: Dead code and a tangled function in a hand-written legacy module is a general refactor with no AI-generation angle, so it belongs to cleanup.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-creative"]
execution:
  prompt: >-
    payments/legacy_gateway.py was written by contractors back in 2016 and patched
    by a dozen people since. It's full of functions nobody calls, imports that do
    nothing, and a parse_response function that runs 200 lines. Delete the dead
    parts and split the big function into smaller ones without changing behavior.
    Nothing in this repo was generated, it's all human-written.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: clean-leftovers-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?clean-leftovers"'
    min: 0
    max: 0
    arm: both
