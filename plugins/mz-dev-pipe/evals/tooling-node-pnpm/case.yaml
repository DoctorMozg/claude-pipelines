schema_version: "1.1"
name: tooling-node-pnpm
description: 'SessionStart reads a pnpm project''s dependencies and records vitest, eslint, prettier and tsc.'
tags: [hooks, tooling]
plugins: ["../..", "../../../mz-base"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    Reply with just OK.
  allowed_tools: []
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: test-command
    type: regex
    pattern: '"test": "vitest"'
    target: { source: file, path: .mz/tooling.json }
  - name: lint-command
    type: regex
    pattern: '"lint": "eslint"'
    target: { source: file, path: .mz/tooling.json }
  - name: format-command
    type: regex
    pattern: '"format": "prettier --write"'
    target: { source: file, path: .mz/tooling.json }
  - name: typecheck-command
    type: regex
    pattern: '"typecheck": "tsc --noEmit"'
    target: { source: file, path: .mz/tooling.json }
  - name: install-command
    type: regex
    pattern: '"install": "pnpm install"'
    target: { source: file, path: .mz/tooling.json }
  - name: hook-announced-javascript
    type: regex
    pattern: '"subtype":"hook_response"[^\n]*Project tooling detected: javascript'
    target: trace
