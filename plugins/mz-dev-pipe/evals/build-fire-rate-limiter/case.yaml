schema_version: "1.1"
name: build-fire-rate-limiter
description: Implementing a new Redis-backed rate limiter middleware with tests is a from-scratch feature, which belongs to build.
tags: [routing, fire]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    Implement a rate limiter for our Express API. I want per-API-key limits with a sliding window, backed by Redis, exposed as middleware under src/middleware/. Needs tests too.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: build-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?build"'
