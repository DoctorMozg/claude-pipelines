schema_version: "1.1"
name: verify-near-miss-read-sessions
description: Reading code by hand to find what looks buggy or vulnerable, with nothing to run, is an audit, not a verify pass over existing checks.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    I'm taking over the session handling in auth/sessions.py and auth/middleware.py.
    Don't run anything, just read through both and tell me what looks vulnerable or
    buggy.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: verify-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?verify"'
    min: 0
    max: 0
    arm: both
