schema_version: "1.1"
name: cleanup-fire-tangled-module
description: A behavior-preserving readability pass on a tangled module belongs to cleanup even without its trigger phrases.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    order_service.py has turned into a mess. One 300-line function with six levels
    of nesting, a couple of helpers that nothing calls, and imports left over from
    the old design. Make it easier to read, but it has to do exactly what it does now.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: cleanup-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cleanup"'
