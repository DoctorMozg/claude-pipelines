schema_version: "1.1"
name: tooling-polyglot
description: 'SessionStart records every ecosystem in a repo that mixes Go, Rust and JavaScript.'
tags: [hooks, tooling]
plugins: ["../..", "../../../mz-base"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    Reply with just OK.
  allowed_tools: []
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: go-detected
    type: regex
    pattern: '"go": \{\s*"test": "go test ./..."'
    target: { source: file, path: .mz/tooling.json }
  - name: rust-detected
    type: regex
    pattern: '"rust": \{\s*"test": "cargo test"'
    target: { source: file, path: .mz/tooling.json }
  - name: javascript-detected
    type: regex
    pattern: '"javascript": \{'
    target: { source: file, path: .mz/tooling.json }
  - name: hook-announced-all
    type: regex
    pattern: '"subtype":"hook_response"[^\n]*Project tooling detected: go,javascript,rust'
    target: trace
