schema_version: "1.1"
name: decomment-fire-http-client-comments
description: A user asks to cut stiff signature-restating docstrings and divider comments in one named file with no code changes, without using the skill's vocabulary.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-base", "../../../mz-creative"]
execution:
  prompt: >-
    Every function in utils/http_client.py has a docstring in the same stiff format,
    "This function sends a GET request. Args: url (str): the url. Returns: Response:
    the response." It says nothing the signature doesn't already say. There are also
    "# ---- Helper functions ----" divider lines between every group. Cut that noise
    down to what's actually useful. Comments only, no code changes, and keep the note
    about the retry workaround.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: decomment-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?decomment"'
