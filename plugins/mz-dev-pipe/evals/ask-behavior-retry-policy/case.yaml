schema_version: "1.1"
name: ask-behavior-retry-policy
description: 'A question about this repo is answered from its code with a file:line citation and a saved report, using codebase researchers only, and no source file is touched.'
tags: [behavior, track-d]
plugins: ["../..", "../../../mz-base"]
runs: 1
# Write and Edit are gated tools: make eval PLUGIN=mz-dev-pipe EVAL_ARGS="--allow-tools Write Edit --case ask-behavior-*"
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-dev-pipe:ask where is the retry policy for the background jobs set in this
    repo, and what are its values?
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep]
  max_turns: 25
  timeout_seconds: 600
graders:
  # A slash prompt loads the skill without a Skill call, so the task state file that only the skill writes is the proof it ran.
  - name: ask-ran
    type: regex
    pattern: 'File created successfully at: \S*\.mz/task/\d{4}_\d{2}_\d{2}_ask_[a-z0-9_]+/state\.md'
    target: trace
  - name: codebase-researcher-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-researcher"'
    min: 1
    max: 3
  # The question is about this repo's code, so the web phase is skipped.
  - name: web-researcher-not-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-web-researcher"'
    min: 0
    max: 0
  # The verification block can follow the answer in a later message, so match any main-thread text block; a researcher's own return carries a parent id.
  - name: answer-cites-file-line-and-values
    type: regex
    pattern: '"role":"assistant","content":\[\{"type":"text","text":"(?=[^\n]*jobs\.py:\d+)(?=[^\n]*\b7\b)(?=[^\n]*\b45\b)[^\n]*"parent_tool_use_id":null'
    target: trace
  - name: report-written
    type: regex
    pattern: 'File created successfully at: \S*\.mz/reports/\d{4}_\d{2}_\d{2}_ask_[a-z0-9_]+\.md'
    target: trace
  - name: source-intact
    type: regex
    pattern: 'JOB_MAX_RETRIES = 7'
    target: { source: file, path: app/jobs.py }
  - name: no-edit-outside-mz
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
  - name: no-write-outside-mz
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*\.mz/)'
    min: 0
    max: 0
