schema_version: "1.1"
name: polish-fire-restating-docstrings
description: Removing AI-sounding docstrings and banner comments from a branch is a polish residue criterion.
tags: [routing, fire]
plugins: ["../..", "../../../mz-base", "../../../mz-creative"]
execution:
  prompt: >-
    Can you strip the AI comments out of this branch? Every function got a docstring
    that just restates its signature, and there are "# ===== Helpers =====" banners
    all over. Only touch comments and docstrings, leave the code alone.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: polish-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?polish"'
