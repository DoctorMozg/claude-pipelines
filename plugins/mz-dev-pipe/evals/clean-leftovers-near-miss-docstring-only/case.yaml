schema_version: "1.1"
name: clean-leftovers-near-miss-docstring-only
description: Stripping filler docstrings and comments while leaving all code untouched is the narrow comment-only job that belongs to decomment.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-creative"]
execution:
  prompt: >-
    Copilot filled lib/parsers/csv_reader.py with docstrings like "This function
    takes a path and returns a list of rows" and comments that repeat the next line
    of code. Strip those filler docstrings and comments. Only the comments, the
    code itself has to stay byte-for-byte identical.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: clean-leftovers-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?clean-leftovers"'
    min: 0
    max: 0
    arm: both
