schema_version: "1.1"
name: clean-leftovers-fire-billing-traces
description: A user asks to remove an agent's signature, plan-step comments and uncalled stubs from services/billing/ without using the skill's own vocabulary.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-base", "../../../mz-creative"]
execution:
  prompt: >-
    An agent built most of services/billing/ over the weekend and I'm about to open
    the PR. Every file starts with a "Generated by Claude Code" header, there are
    comments like "Step 3 of the plan: add retry logic" scattered around, and a few
    stub functions that just raise NotImplementedError and that nothing calls. Take
    all of that out so it reads like a person wrote it. The real logic stays.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: clean-leftovers-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?clean-leftovers"'
