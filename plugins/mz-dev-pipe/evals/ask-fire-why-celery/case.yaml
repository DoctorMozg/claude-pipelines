schema_version: "1.1"
name: ask-fire-why-celery
description: A why-do-we-use question about a design choice needs codebase research and a sourced answer, which is ask.
tags: [routing, fire]
plugins: ["../..", "../../../mz-research-pipe", "../../../mz-base"]
execution:
  prompt: >-
    Why do we use Celery for the background jobs here instead of just RQ? Check the
    repo and tell me.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: ask-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ask"'
