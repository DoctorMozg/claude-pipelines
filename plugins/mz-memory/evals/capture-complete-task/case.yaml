schema_version: "1.1"
name: capture-complete-task
description: 'SessionEnd logs a completed task with its Decisions and Notes, strips private text, and files its Lessons in the inbox.'
tags: [hooks, capture]
plugins: ["../.."]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    Reply with just OK.
  allowed_tools: []
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: task-logged-with-git-ref
    type: regex
    pattern: '^- \[\d{4}-\d{2}-\d{2}\] 2026_11_02_build_password_reset \(phase=done\) \[[\w./-]+@[0-9a-f]{7,}\]$'
    flags: m
    target: { source: file, path: .mz/memory/MEMORY.md }
  - name: decision-copied
    type: regex
    pattern: 'argon2id'
    target: { source: file, path: .mz/memory/MEMORY.md }
  - name: notes-copied
    type: regex
    pattern: 'Reset links expire after 20 minutes'
    target: { source: file, path: .mz/memory/MEMORY.md }
  - name: private-text-stripped
    type: regex
    pattern: 'hunter2|pepper='
    match: not_contains
    target: { source: file, path: .mz/memory/MEMORY.md }
  - name: lesson-not-in-log
    type: regex
    pattern: 'Seed fixtures'
    match: not_contains
    target: { source: file, path: .mz/memory/MEMORY.md }
  - name: lesson-in-inbox
    type: regex
    pattern: 'Seed fixtures before running migrations in tests'
    target: { source: file, path: .mz/memory/lessons.md }
