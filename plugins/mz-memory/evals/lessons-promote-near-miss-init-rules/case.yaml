schema_version: "1.1"
name: lessons-promote-near-miss-init-rules
description: 'Installing curated rule packs belongs to init-rules, even though both end in project rules.'
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    Install the standard coding rules for this project.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: lessons-promote-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?lessons-promote"'
    min: 0
    max: 0
    arm: both
