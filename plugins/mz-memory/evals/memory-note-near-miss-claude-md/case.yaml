schema_version: "1.1"
name: memory-note-near-miss-claude-md
description: 'The user names CLAUDE.md as the target file, so this is a direct edit, not a memory note.'
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    Add a line to CLAUDE.md saying Go files in this repo use tabs for indentation.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: memory-note-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?memory-note"'
    min: 0
    max: 0
    arm: both
