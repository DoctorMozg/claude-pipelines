schema_version: "1.1"
name: memory-note-lesson-typo
description: 'The correction nudge fires on a typo fix, but a slip no rule would have prevented needs only the fix, so no lesson is saved.'
tags: [lessons, nudge]
plugins: ["../.."]
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    No, it's spelled Kowalski, with an i at the end. Fix the name in CONTRIBUTORS.md.
  allowed_tools: [Skill, Bash, Read, Edit]
  max_turns: 8
  timeout_seconds: 240
graders:
  - name: typo-fixed
    type: regex
    pattern: 'Anna Kowalski \(billing\)'
    target: { source: file, path: CONTRIBUTORS.md }
  - name: lesson-script-not-run
    type: tool_used
    tool: Bash
    input_match: 'memory-note\.sh.{0,8}--lesson'
    min: 0
    max: 0
  - name: lessons-file-intact
    type: regex
    pattern: '<!-- mz-inbox-start -->'
    target: { source: file, path: .mz/memory/lessons.md }
  - name: inbox-empty
    type: regex
    pattern: '\[I-[0-9]{4}\]'
    match: not_contains
    target: { source: file, path: .mz/memory/lessons.md }
