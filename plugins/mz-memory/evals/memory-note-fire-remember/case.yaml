schema_version: "1.1"
name: memory-note-fire-remember
description: 'The user asks to remember a project rule for later sessions, which memory-note pins.'
tags: [routing, fire]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    Remember that we only deploy from release branches, never straight from main.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: memory-note-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?memory-note"'
