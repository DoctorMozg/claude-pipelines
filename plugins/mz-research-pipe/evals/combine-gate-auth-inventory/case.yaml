schema_version: "1.1"
name: combine-gate-auth-inventory
description: 'combine builds an inventory of three to six lenses from fresh local sources, excludes a stale unrelated report, shows the decomposition gate and dispatches no lens agent.'
tags: [track-d, gate, needs-bash]
plugins: ["../..", "../../../mz-dev-pipe", "../../../mz-base"]
runs: 1
# Bash is granted for the read-only ls and git commands that the inventory step runs: make eval PLUGIN=mz-research-pipe EVAL_ARGS="--allow-tools Bash --case combine-gate-*"
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-research-pipe:combine synthesize our findings on the auth refactor
  allowed_tools: [Skill, Agent, Bash, Read, Write, Edit, Glob, Grep]
  max_turns: 20
  timeout_seconds: 420
graders:
  # The skill names its task folder in a Write or in the Bash mkdir that the eval sandbox refuses.
  - name: combine-ran
    type: regex
    pattern: '"name":"(?:Write|Bash)","input":\{[^\n]*\.mz/task/\d{4}_\d{2}_\d{2}_combine_'
    target: trace
  # The inventory step writes inventory.md with Bash, which the sandbox refuses, so the gate message carries the inventory.
  - name: inventory-has-three-or-more-lenses
    type: regex
    pattern: '"type"\s*:\s*"text"\s*,\s*"text"\s*:\s*"(?=(?:[^"\\]|\\.)*?Inventory ready for review)(?=(?:[^"\\]|\\.)*?Lens 3\b)'
    target: trace
  - name: inventory-stays-under-the-lens-cap
    type: regex
    pattern: '"type"\s*:\s*"text"\s*,\s*"text"\s*:\s*"(?=(?:[^"\\]|\\.)*?Inventory ready for review)(?=(?:[^"\\]|\\.)*?Lens 7\b)'
    match: not_contains
    target: trace
  # The billing report is 400 days old against a 60-day limit and shares no word with the task slug.
  - name: stale-report-excluded
    type: regex
    pattern: '"type"\s*:\s*"text"\s*,\s*"text"\s*:\s*"(?=(?:[^"\\]|\\.)*?Inventory ready for review)(?=(?:[^"\\]|\\.)*?Excluded sources(?:[^"\\]|\\.)*?billing_export)'
    target: trace
  # The gate message is a text block of its own, so the trace is searched for a text block and not for the phase file that quotes it.
  - name: gate-message-emitted
    type: regex
    pattern: '"type"\s*:\s*"text"\s*,\s*"text"\s*:\s*"(?=(?:[^"\\]|\\.)*?Inventory ready for review)(?=(?:[^"\\]|\\.)*?Proposed lenses)'
    target: trace
  - name: no-lens-agent-dispatched
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  # The inventory step reads names and mtimes only; file bodies belong to the lens agents.
  - name: no-source-body-read
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*/\.mz/(?:research|reports|task/2026_10_25)'
    min: 0
    max: 0
  - name: no-source-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/\.mz/(?:research|reports|reviews)/'
    min: 0
    max: 0
  - name: seed-research-intact
    type: regex
    pattern: 'RS256 signing'
    target: { source: file, path: .mz/research/2026_10_20_research_auth_refactor.md }
