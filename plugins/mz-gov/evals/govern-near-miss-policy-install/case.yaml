schema_version: "1.1"
name: govern-near-miss-policy-install
description: Putting the governance policy block into CLAUDE.md is a setup task that belongs to gov-init, not a decision to run through govern.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-dev-pipe", "../../../mz-dev-git", "../../../mz-base"]
execution:
  prompt: >-
    Set this repo up so Claude brings up a decision record on its own whenever we
    start a big architectural change. Whatever governance policy that needs, put it
    in our CLAUDE.md.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: govern-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?govern"'
    min: 0
    max: 0
    arm: both
  - name: gov-init-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gov-init"'
