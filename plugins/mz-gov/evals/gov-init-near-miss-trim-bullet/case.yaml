schema_version: "1.1"
name: gov-init-near-miss-trim-bullet
description: Shortening one bullet of the governance section by hand is a small manual edit that needs no skill.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-dev-pipe", "../../../mz-dev-git", "../../../mz-base"]
execution:
  prompt: >-
    Small thing in CLAUDE.md. The governance section has a bullet about exempting
    throwaway spikes and it runs three lines for no reason. Cut it down to one
    line, same meaning. I'll reword it properly later.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: gov-init-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gov-init"'
    min: 0
    max: 0
    arm: both
