schema_version: "1.1"
name: govern-near-miss-module-split
description: A pure move of code between files with no behavior change is a behavior-preserving refactor, exempt from governance and handled by cleanup.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-dev-pipe", "../../../mz-dev-git", "../../../mz-base"]
execution:
  prompt: >-
    billing/invoice.py is 900 lines and does both the data models and the PDF
    rendering. Split it into invoice_models.py and invoice_render.py. It's a pure
    move, nothing about behavior changes, and the existing imports from
    billing.invoice should keep working.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: govern-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?govern"'
    min: 0
    max: 0
    arm: both
  - name: cleanup-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cleanup"'
