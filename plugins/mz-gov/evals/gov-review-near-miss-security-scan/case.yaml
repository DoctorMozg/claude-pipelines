schema_version: "1.1"
name: gov-review-near-miss-security-scan
description: A read-only scan of source modules for security holes and logic bugs is a code audit, which belongs to audit.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-dev-pipe", "../../../mz-dev-git", "../../../mz-base"]
execution:
  prompt: >-
    Pre-release sanity pass on the auth and payments modules. Look for security
    holes and logic bugs and put everything in a findings file. I don't want any
    code changed.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: gov-review-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gov-review"'
    min: 0
    max: 0
    arm: both
  - name: audit-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?audit"'
