schema_version: "1.1"
name: do-roast-fire-sergeant-session-manager
description: A request to have a drill sergeant scream at a named file for a team retro belongs to do-roast even though it never says roast.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-dev-git", "../../../mz-dev-pipe", "../../../mz-research-pipe", "../../../mz-base"]
execution:
  prompt: >-
    I'm presenting at our team retro tomorrow and I want to get a laugh out of
    everyone. Can you read services/auth/session_manager.go and have an angry drill
    sergeant scream at it? Insults welcome, but every single one has to be about
    something that's actually wrong in there.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: do-roast-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?do-roast"'
