schema_version: "1.1"
name: github-review-pr-near-miss-unpushed-branch
description: Unpushed commits on a local branch belong to review-branch, since no GitHub pull request exists yet.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    I've been on feature/csv-export for two weeks, about 15 commits, nothing pushed yet.
    Before I open a pull request I'd like someone to go through the whole thing against main
    and tell me what a picky reviewer would flag: bugs, missing tests, naming, whatever.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: github-review-pr-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-review-pr"'
    min: 0
    max: 0
    arm: both
