schema_version: "1.1"
name: review-branch-near-miss-pr-url
description: A pushed GitHub PR belongs to github-review-pr, so review-branch must not fire.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: Can you review https://github.com/cli/cli/pull/14717 and tell me if it's ready to merge?
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: review-branch-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review-branch"'
    min: 0
    max: 0
    arm: both
