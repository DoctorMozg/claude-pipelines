schema_version: "1.1"
name: github-review-pr-fire-signoff
description: A user wants a read of an existing GitHub pull request, including prior feedback, before approving it.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    A colleague posted https://github.com/astral-sh/ruff/pull/15012 and wants my sign-off.
    Read through the diff and whatever people have already said on it, then tell me whether
    I should approve or push back.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: github-review-pr-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-review-pr"'
