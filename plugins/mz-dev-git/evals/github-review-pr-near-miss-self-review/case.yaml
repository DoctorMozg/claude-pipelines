schema_version: "1.1"
name: github-review-pr-near-miss-self-review
description: A self-review of a local branch ahead of opening a pull request belongs to review-branch, not github-review-pr.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base"]
execution:
  prompt: >-
    do a code review of my local branch vs origin/main before I raise the PR
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: github-review-pr-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-review-pr"'
    min: 0
    max: 0
    arm: both
  - name: review-branch-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review-branch"'
