schema_version: "1.1"
name: init-rules-near-miss-obsidian-vault
description: Laying out folders, a CLAUDE.md and frontmatter conventions for a new Obsidian vault is vault bootstrapping, so it belongs to obsidian-init rather than init-rules.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-dev-pipe", "../../../mz-dev-git", "../../../mz-knowledge"]
execution:
  prompt: >-
    Starting a fresh Obsidian vault at ~/Documents/second-brain for my reading and
    research notes, mostly papers on speech recognition plus some personal
    journaling. I want the folder structure, a CLAUDE.md that tells Claude how to
    file and tag things, and the frontmatter conventions all set up so I can start
    dropping notes in tonight.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: init-rules-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?init-rules"'
    min: 0
    max: 0
    arm: both
