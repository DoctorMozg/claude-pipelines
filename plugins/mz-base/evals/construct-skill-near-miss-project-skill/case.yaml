schema_version: "1.1"
name: construct-skill-near-miss-project-skill
description: A project skill under .claude/skills in a repo with no plugins tree is out of scope for construct-skill and needs no skill from this listing.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-dev-pipe", "../../../mz-dev-git", "../../../mz-knowledge"]
execution:
  prompt: >-
    This is a plain Django repo, just manage.py, apps/ and a requirements.txt. No
    plugins directory, no marketplace anything. I want a project skill at
    .claude/skills/run-migrations/SKILL.md so Claude knows how we apply and roll
    back migrations here: always dry-run with sqlmigrate first and never touch the
    squashed ones. Can you write it?
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: construct-skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?construct-skill"'
    min: 0
    max: 0
    arm: both
