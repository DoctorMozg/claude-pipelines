schema_version: "1.1"
name: pipeline-web-researcher-fire-runner-upgrade
description: Checking what an OS upgrade changes for a build, with the upstream pages as proof, is sourced web research even though the request never says research.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-dev-pipe", "../../../mz-dev-git", "../../../mz-knowledge"]
execution:
  prompt: >-
    Our CI runners move from Ubuntu 22.04 to 24.04 next sprint. Find out which
    default package versions and kernel settings differ in ways that could break
    a Docker-based build, and point me at the upstream pages that say so.
  allowed_tools: [Agent]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: web-researcher-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pipeline-web-researcher"'
    arm: with-only
