schema_version: "1.1"
name: construct-skill-near-miss-branch-skill-edits
description: Reviewing the skill edits already made on the current branch against main is a branch review, so it belongs to review-branch.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-dev-pipe", "../../../mz-dev-git", "../../../mz-knowledge"]
execution:
  prompt: >-
    Review my branch before I push. It rewrites four SKILL.md descriptions and
    edits a couple of phase files in plugins/mz-dev-pipe, so check the lot
    against main.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: construct-skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?construct-skill"'
    min: 0
    max: 0
    arm: both
