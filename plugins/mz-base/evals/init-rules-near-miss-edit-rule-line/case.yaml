schema_version: "1.1"
name: init-rules-near-miss-edit-rule-line
description: Changing one number in an existing rule file is a direct edit that needs no skill, since init-rules installs rules and does not edit their content.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-dev-pipe", "../../../mz-dev-git", "../../../mz-knowledge"]
execution:
  prompt: >-
    Bump the line length in .claude/rules/python-conventions.md from 88 to 100.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: init-rules-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?init-rules"'
    min: 0
    max: 0
    arm: both
