schema_version: "1.1"
name: design-document-fire-clinic-reschedule
description: Working out the screens and flow of a new patient-facing feature on paper, with accessibility in mind and no code, belongs to design-document.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-dev-pipe", "../../../mz-creative", "../../../mz-dev-git", "../../../mz-base"]
execution:
  prompt: >-
    Our clinic wants patients to reschedule appointments from their phones. Work
    out which screens it needs and how people get through them, with a layout for
    each one, and make sure older patients with poor eyesight can read it. No
    code, I just need it on paper for the team to react to.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: design-document-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?design-document"'
