schema_version: "1.1"
name: design-document-near-miss-home-screen-ideas
description: Asking for a pile of different directions to react to, with no spec to commit to, is brainstorming.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-dev-pipe", "../../../mz-creative", "../../../mz-dev-git", "../../../mz-base"]
execution:
  prompt: >-
    I'm really stuck on what the home screen of our meditation app could feel
    like. I'm not after a finished plan or anything to sign off. I'd like a pile
    of very different directions, from a few different angles, so I can react to
    whatever grabs me.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: design-document-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?design-document"'
    min: 0
    max: 0
    arm: both
