schema_version: "1.1"
name: process-notes-fire-daily-note-atomize
description: Turning a daily note into atomic permanent notes is the fleeting-to-permanent pipeline, which belongs to process-notes.
tags: [routing, fire]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    Turn my 2026-10-21 daily note into permanent atomic notes. Draft them first
    and show me the titles before you save anything.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: process-notes-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?process-notes"'
