schema_version: "1.1"
name: obsidian-init-near-miss-pdf-into-vault
description: Capturing a PDF into an already set up vault as a fleeting note belongs to vault-ingest.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    Finished setting up my new vault last night, it has CLAUDE.md and the folders and
    everything. First thing I want in it is the Raft paper, the PDF is at
    ~/Downloads/raft.pdf. Capture it as a fleeting note in the inbox.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: obsidian-init-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?obsidian-init"'
    min: 0
    max: 0
    arm: both
  - name: vault-ingest-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-ingest"'
