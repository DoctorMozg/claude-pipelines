schema_version: "1.1"
name: vault-refactor-args-no-separator
description: 'Without the :: separator vault-refactor asks which half is the old name and which the new one, instead of guessing, and dispatches no agent and writes nothing.'
tags: [args, track-d]
plugins: ["../.."]
# Write is a gated tool: make eval PLUGIN=mz-knowledge EVAL_ARGS="--allow-tools Write Edit --case 'vault-refactor-args-*'"
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-knowledge:vault-refactor Stoicism overview Stoic practices that still work today
  allowed_tools: [Skill, Agent, Read, Write, Edit, Glob, Grep]
  max_turns: 10
  timeout_seconds: 300
graders:
  # AskUserQuestion isn't available in eval sessions, so the question can only be asked in chat. Only the skill's argument hint names the :: format.
  - name: asks-for-the-separator-format
    type: regex
    pattern: '::'
  - name: no-agent-dispatched
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  # Phase 0 asks before it creates the task folder, so nothing at all may be written.
  - name: nothing-written
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: nothing-edited
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: nothing-created
    type: regex
    pattern: '\S'
    match: not_contains
    target: files
  - name: note-keeps-its-name-and-content
    type: regex
    pattern: 'Stoic ethics rests on the dichotomy of control'
    target: { source: file, path: "04 - Permanent/Stoicism overview.md" }
  - name: referrer-keeps-old-link
    type: regex
    pattern: 'central to \[\[Stoicism overview\]\]\.'
    target: { source: file, path: "04 - Permanent/Dichotomy of control.md" }
  - name: referrer-not-rewritten
    type: regex
    pattern: 'Stoic practices'
    match: not_contains
    target: { source: file, path: "04 - Permanent/Dichotomy of control.md" }
