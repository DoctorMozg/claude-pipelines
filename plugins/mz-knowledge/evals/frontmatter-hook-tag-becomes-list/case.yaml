schema_version: "1.1"
name: frontmatter-hook-tag-becomes-list
description: 'After Claude writes a vault note with a singular hashed tag, the PostToolUse hook rewrites it to a tags list, and Claude reads the rewritten note back.'
tags: [hooks, frontmatter]
plugins: ["../.."]
# Write is a gated tool: make eval PLUGIN=mz-knowledge EVAL_ARGS="--allow-tools Write --case frontmatter-hook-*"
context:
  scaffold_script: fixture.sh
execution:
  prompt: |-
    Use the Write tool to create notes/ethics.md with exactly this content:

    ---
    tag: "#AI Ethics"
    ---
    # AI ethics

    Then Read notes/ethics.md and reply with only the lines between its two --- markers.
  allowed_tools: [Write, Read]
  max_turns: 5
  timeout_seconds: 180
graders:
  - name: wrote-the-note
    type: tool_used
    tool: Write
    input_match: 'notes/ethics\.md'
  # PostToolUse output never reaches an eval trace, so the Read of the rewritten note is the proof.
  - name: note-on-disk-was-rewritten
    type: regex
    pattern: '"type":"tool_result"[^\n]*- AI-Ethics'
    target: trace
  - name: reply-shows-the-tags-list
    type: regex
    pattern: '- AI-Ethics'
