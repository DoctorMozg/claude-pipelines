schema_version: "1.1"
name: vault-connect-fire-idempotency-relations
description: Asking which older notes a just-written note should be tied to, and whether each backs it up or argues against it, is typed link discovery for vault-connect without its trigger words.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    I just wrote up how idempotency keys make payment retries safe, and I'm certain
    I've got older notes on retries and duplicate charges somewhere. Find the ones
    this new note should be tied to, and for each tell me whether it backs up the
    idea, pushes against it, or just sits next to it.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-connect-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-connect"'
