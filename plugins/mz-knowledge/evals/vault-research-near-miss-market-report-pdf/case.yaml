schema_version: "1.1"
name: vault-research-near-miss-market-report-pdf
description: Capturing an externally supplied PDF into the vault as a fleeting note is raw multimodal capture, so it belongs to vault-ingest and not to vault-research.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    A consultant sent over a 40-page market research report as a PDF, it's at
    ~/Downloads/market-sizing-q3.pdf. Get the text into my vault as a note so I
    can read through it this weekend.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-research-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-research"'
    min: 0
    max: 0
    arm: both
  - name: vault-ingest-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-ingest"'
