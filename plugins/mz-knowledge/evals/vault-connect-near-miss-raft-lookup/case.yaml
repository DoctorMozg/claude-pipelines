schema_version: "1.1"
name: vault-connect-near-miss-raft-lookup
description: Reading notes to report what they say about a topic is content retrieval, which vault-connect excludes and vault-answer covers.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    Which of my notes talk about leader election in Raft or Paxos? Tell me what each
    one says, I only want to read, not change anything.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-connect-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-connect"'
    min: 0
    max: 0
    arm: both
