schema_version: "1.1"
name: vault-answer-near-miss-book-frontmatter
description: Checking which notes break the declared frontmatter rules is schema validation, which belongs to vault-schema.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    Check the frontmatter on everything in Resources/Books/ against the type
    definitions I set up. Which notes break the rules, and what is wrong in each?
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-answer-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-answer"'
    min: 0
    max: 0
    arm: both
  - name: vault-schema-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-schema"'
