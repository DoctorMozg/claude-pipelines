schema_version: "1.1"
name: vault-triage-fire-work-vault-inbox
description: A direct request to triage the inbox and decide promote, merge, discard or defer per fleeting note belongs to vault-triage.
tags: [routing, fire]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    Triage my inbox. Vault is at ~/vaults/work. I want to go through the fleeting
    notes quickly and decide for each one: promote, merge into something,
    discard, or defer.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-triage-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-triage"'
