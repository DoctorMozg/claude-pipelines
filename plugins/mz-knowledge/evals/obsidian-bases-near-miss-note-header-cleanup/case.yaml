schema_version: "1.1"
name: obsidian-bases-near-miss-note-header-cleanup
description: Fixing frontmatter, wikilinks and a callout inside one .md note is Obsidian Flavored Markdown work for obsidian-markdown, with no .base file involved.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    Clean up the top of Inbox/2026-10-14 call notes.md for me. Frontmatter should have
    tags and aliases as proper lists, the markdown links to my other notes should
    become wikilinks, and the action items need to go into a collapsible callout
    titled Follow-ups.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: obsidian-bases-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?obsidian-bases"'
    min: 0
    max: 0
    arm: both
