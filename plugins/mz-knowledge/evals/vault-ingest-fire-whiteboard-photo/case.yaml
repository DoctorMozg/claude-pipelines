schema_version: "1.1"
name: vault-ingest-fire-whiteboard-photo
description: Pulling the handwriting from a photo into the vault as raw text to sort later is image capture, which belongs to vault-ingest.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    After today's design review I took a photo of the whiteboard. It is all
    handwritten boxes and arrows with some labels scribbled next to them. I want
    the text from it saved in my vault so I can sort it out later.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-ingest-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-ingest"'
