schema_version: "1.1"
name: vault-provenance-near-miss-island-note
description: Finding which other notes an isolated note should link to, with how each relates, is link discovery, so it belongs to vault-connect.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    Habit stacking.md sits there with zero links and I know I've written related
    stuff. Find the notes in my vault it should be linked to, and for each one say
    how they relate, like whether it supports or contradicts my note. I'll pick
    which links to add.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-provenance-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-provenance"'
    min: 0
    max: 0
    arm: both
  - name: vault-connect-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-connect"'
