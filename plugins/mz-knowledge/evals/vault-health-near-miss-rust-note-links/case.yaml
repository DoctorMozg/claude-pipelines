schema_version: "1.1"
name: vault-health-near-miss-rust-note-links
description: Suggesting which existing notes one isolated note should link to is vault-connect work, not a vault-wide health audit.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    Notes/Rust/Borrow checker.md has no links in or out. Which other notes in my vault
    are related enough that it should link to them? Suggest the wikilinks and where in
    the text each one would go.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-health-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-health"'
    min: 0
    max: 0
    arm: both
  - name: vault-connect-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-connect"'
