schema_version: "1.1"
name: obsidian-markdown-fire-stats-cheat-sheet
description: Typeset formulas, highlighted terms and private remarks that never render are Obsidian-specific syntax requested by goal, not by name.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    I'm building a stats cheat sheet in Obsidian. Variance and standard deviation
    should show up as proper typeset formulas, the three terms I always forget need
    to stand out with a highlight, and I want a few private remarks to myself that
    disappear when I read the note.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: obsidian-markdown-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?obsidian-markdown"'
