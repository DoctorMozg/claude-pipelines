schema_version: "1.1"
name: vault-review-fire-month-end-resurface
description: Resurfacing older ideas worth revisiting so they don't fade is vault-review's job, stated here as a goal with no path or skill vocabulary.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    End of the month and I've got a free hour. I'd like to go back over my older
    ideas so they don't just quietly rot in the vault. Which ones should I spend
    the hour on?
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-review-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-review"'
