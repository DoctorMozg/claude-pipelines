schema_version: "1.1"
name: vault-ingest-near-miss-transcript-split
description: Splitting a transcript that is already in the vault into atomic notes is fleeting-to-permanent processing, so it belongs to process-notes.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    Inbox/2026-10-19 walk dictation.md is a transcript I captured last week, about
    1800 words with at least three unrelated ideas jammed together. Split it into
    separate permanent notes, each titled as a claim.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-ingest-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-ingest"'
    min: 0
    max: 0
    arm: both
  - name: process-notes-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?process-notes"'
