schema_version: "1.1"
name: obsidian-cli-fire-daily-append
description: Appending to the daily note and reading it back with the obsidian command from a shell is the core use of the obsidian CLI skill.
tags: [routing, fire]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    Give me the obsidian CLI calls to append "Deployed v2.3 to prod" to today's
    daily note and then read the note back from the shell so I can see it landed.
    Run them.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: obsidian-cli-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?obsidian-cli"'
