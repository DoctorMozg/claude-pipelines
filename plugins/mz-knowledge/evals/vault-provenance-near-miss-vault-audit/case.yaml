schema_version: "1.1"
name: vault-provenance-near-miss-vault-audit
description: A vault-wide report on unlinked notes, dead wikilinks, stubs, old notes and tag drift is a hygiene audit, so it belongs to vault-health.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    It's been a few months since I looked after the vault in ~/Documents/Brain.
    Before my review session I want an overall picture of how it's holding up:
    notes with nothing linking to them, wikilinks that point nowhere, stubs, old
    notes nobody has touched, and tags that drifted apart. Just report, don't fix
    anything.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-provenance-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-provenance"'
    min: 0
    max: 0
    arm: both
  - name: vault-health-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-health"'
