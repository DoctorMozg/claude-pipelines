schema_version: "1.1"
name: vault-research-fire-onboarding-panel-session
description: Turning the conclusions of a long generated panel write-up at a .mz/reports path into separate vault notes with source provenance is vault-research work even without its vocabulary.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    There's a file at .mz/reports/2026_11_01_expert_onboarding-redesign.md from
    the panel session we ran on our onboarding flow. It's about 4,000 words and
    I will never reread it. Pull the conclusions into my Obsidian vault as
    separate notes, one claim each, under my permanent folder, and keep the
    path to that file in every note's frontmatter. Leave out the vote counts
    and the debate transcript.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-research-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-research"'
