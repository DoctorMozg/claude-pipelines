schema_version: "1.1"
name: vault-ingest-fire-walk-recording
description: Getting what was said in a local audio recording into the vault as text is capture of a new voice file, which belongs to vault-ingest.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    ~/Recordings/2026-10-31 walk.m4a is about 20 minutes of me talking through how
    to restructure the billing service while walking the dog. I can't be bothered to
    listen to it again. Get what I said into my Obsidian vault as text.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-ingest-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-ingest"'
