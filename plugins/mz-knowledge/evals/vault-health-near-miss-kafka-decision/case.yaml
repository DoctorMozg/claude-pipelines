schema_version: "1.1"
name: vault-health-near-miss-kafka-decision
description: A content question to be answered from vault notes belongs to vault-answer, since vault-health only inventories note health.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    what did I end up deciding about the partition count for the orders topic in
    Kafka? should be somewhere in my vault
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-health-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-health"'
    min: 0
    max: 0
    arm: both
