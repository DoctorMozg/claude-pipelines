schema_version: "1.1"
name: vault-schema-near-miss-fix-year-typo
description: Correcting one sentence in a note body is a plain edit that needs no skill, even though the note carries a status property.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    Reading/Show Your Work.md is already marked status: evergreen and everything at
    the top of it is correct. The only problem is in the Takeaways section, where I
    wrote that the book came out in 2019. It was 2014. Fix that one sentence.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-schema-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-schema"'
    min: 0
    max: 0
    arm: both
