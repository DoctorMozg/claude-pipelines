schema_version: "1.1"
name: vault-refactor-fire-stoicism-title
description: Renaming a note and updating every wikilink that points to it is exactly the vault-refactor job.
tags: [routing, fire]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    Rename my note Stoicism overview to Stoic practices that still work today and
    update every wikilink that points to it. The vault is at ~/Documents/Zettelkasten.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-refactor-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-refactor"'
