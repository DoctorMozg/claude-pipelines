schema_version: "1.1"
name: obsidian-bases-fire-finished-books
description: A live ranked overview of notes with an average at the bottom, using only core Obsidian, is a Bases request stated as a goal.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    I want one page in my Obsidian vault that lists every book I finished this year,
    best rated first, with the average rating at the bottom. Books are one note each,
    rating and finished date in the properties. Core Obsidian only, no Dataview.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: obsidian-bases-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?obsidian-bases"'
