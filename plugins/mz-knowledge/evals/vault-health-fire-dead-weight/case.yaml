schema_version: "1.1"
name: vault-health-fire-dead-weight
description: Asking how much of a long-running vault is disconnected, abandoned or tagged inconsistently, with no fixes yet, belongs to vault-health.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-base", "../../../mz-dev-pipe"]
execution:
  prompt: >-
    My notes have been piling up for three years and I suspect a big chunk is dead
    weight: things that sit completely alone, things I wrote once and abandoned, and
    the same tag spelled three different ways. Do not fix anything yet. I just want to
    know how bad it is.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: vault-health-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vault-health"'
