schema_version: "1.1"
name: freelance-search-fire-go-backend-eu
description: Asking to find freelance gigs matched to a CV with a day-rate floor is the core freelance-search job.
tags: [routing, fire]
plugins: ["../..", "../../../mz-biz-outreach", "../../../mz-creative", "../../../mz-base"]
execution:
  prompt: >-
    Find freelance gigs for me. My CV is at ~/cv/dmitri_backend.md. Senior backend,
    Go and Rust, remote within the EU, 650 EUR a day or better. Project work or
    contract is fine, and I'd like the top five to pitch.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: freelance-search-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?freelance-search"'
