schema_version: "1.1"
name: job-recruiter-info-near-miss-cv-shortlist
description: Matching many open vacancies against a CV and ranking a shortlist is the full job hunt pipeline, so it belongs to job-search even though it also asks who to email.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-biz-outreach", "../../../mz-creative", "../../../mz-base"]
execution:
  prompt: >-
    I'm a Rust dev with six years across embedded and backend work, CV is at
    ~/Documents/cv/cv_2026.pdf. Go through what's open in Berlin and Amsterdam right
    now, match the openings against my CV and give me a ranked shortlist of the ten
    best fits. For the top few, also tell me who I should email about the application.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: job-recruiter-info-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?job-recruiter-info"'
    min: 0
    max: 0
    arm: both
  - name: job-search-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?job-search"'
