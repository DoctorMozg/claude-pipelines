schema_version: "1.1"
name: job-search-near-miss-one-cover-letter
description: A single cover letter for a role the user has already applied to is a writing task for copywrite, not a search across vacancies.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-biz-outreach", "../../../mz-creative", "../../../mz-base"]
execution:
  prompt: >-
    I already applied to the Staff SRE posting at Cloudflare through their site
    and now they want a cover letter by tomorrow. Write it for me, around 250 words,
    based on my resume at ~/cv/sre_resume.md. Lean on the on-call and incident
    review work from my last two jobs.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: job-search-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?job-search"'
    min: 0
    max: 0
    arm: both
