schema_version: "1.1"
name: job-recruiter-info-near-miss-company-card-contacts
description: Deepening a company card and drafting sales outreach for its decision makers is B2B contact work, so it belongs to outreach-enrich-company.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-biz-outreach", "../../../mz-creative", "../../../mz-base"]
execution:
  prompt: >-
    We want to pitch our route-optimization API to Northwind Logistics. I already
    have their card at .mz/outreach/2026_10_28_freight_dach/companies/northwind-logistics.md
    but the contacts section is thin. Dig deeper on who the decision makers are on
    the ops and engineering side, then draft an intro email for each of them.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: job-recruiter-info-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?job-recruiter-info"'
    min: 0
    max: 0
    arm: both
