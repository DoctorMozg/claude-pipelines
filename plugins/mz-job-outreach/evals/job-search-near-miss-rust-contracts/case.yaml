schema_version: "1.1"
name: job-search-near-miss-rust-contracts
description: Matching a profile against short fixed-term contracts on vetted boards is project-gig work, so it belongs to freelance-search rather than a salaried job search.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-biz-outreach", "../../../mz-creative", "../../../mz-base"]
execution:
  prompt: >-
    I'm an independent Rust developer and my profile is at ~/cv/rust_dev.md. I'm
    after 3 to 6 month contracts at 650 a day or more, remote within the EU. Check
    the smaller vetted boards, not Upwork, and list the gigs that match my background.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: job-search-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?job-search"'
    min: 0
    max: 0
    arm: both
  - name: freelance-search-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?freelance-search"'
