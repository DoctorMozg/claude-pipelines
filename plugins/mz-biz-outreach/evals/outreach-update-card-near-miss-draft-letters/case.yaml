schema_version: "1.1"
name: outreach-update-card-near-miss-draft-letters
description: Writing outreach messages for a company from its existing card is letter drafting, which belongs to outreach-enrich-company, not recording something that already happened.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-creative", "../../../mz-base", "../../../mz-job-outreach"]
execution:
  prompt: >-
    I've got the Northwind Tools card at .mz/outreach/active/2026-10-30_northwind-tools.md.
    Write me a LinkedIn message and an email for their head of procurement, short and
    friendly, and dig a bit deeper on the company first if the card is thin.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: outreach-update-card-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?outreach-update-card"'
    min: 0
    max: 0
    arm: both
