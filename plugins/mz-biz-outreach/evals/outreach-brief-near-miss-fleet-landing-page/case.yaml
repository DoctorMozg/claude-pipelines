schema_version: "1.1"
name: outreach-brief-near-miss-fleet-landing-page
description: Product landing page copy for a named audience is general marketing copy, so it belongs to copywrite even though it mentions an audience and a region.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-creative", "../../../mz-base", "../../../mz-job-outreach"]
execution:
  prompt: >-
    Our company makes fleet-tracking hardware for regional bus operators, mainly
    in Spain and Portugal. Please write the landing page copy for the product
    site: a hero headline, three benefit blocks and a call to action. Tone
    should be confident but not salesy.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: outreach-brief-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?outreach-brief"'
    min: 0
    max: 0
    arm: both
