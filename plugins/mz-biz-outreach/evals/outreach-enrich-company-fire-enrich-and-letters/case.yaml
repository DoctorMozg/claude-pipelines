schema_version: "1.1"
name: outreach-enrich-company-fire-enrich-and-letters
description: Enriching a saved company card and writing letters for its contacts is the core job of outreach-enrich-company.
tags: [routing, fire]
plugins: ["../..", "../../../mz-creative", "../../../mz-base", "../../../mz-job-outreach"]
execution:
  prompt: >-
    Enrich .mz/outreach/2026_10_28_outreach_research_devops_dach/companies/helvetia-cloudworks.md
    and write outreach letters for the contacts in it. Email only, casual tone.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: outreach-enrich-company-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?outreach-enrich-company"'
