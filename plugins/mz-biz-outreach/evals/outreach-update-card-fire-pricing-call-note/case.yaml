schema_version: "1.1"
name: outreach-update-card-fire-pricing-call-note
description: Saving the outcome of a call into a specific research file under .mz/outreach is a dated history entry on that company's card, even without the skill's wording.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-creative", "../../../mz-base", "../../../mz-job-outreach"]
execution:
  prompt: >-
    Talked to Maria Okafor at Novacrest Energy for about twenty minutes today. She's
    open to it and wants a pricing sheet by next Friday. Please make a note of that in
    .mz/outreach/2026-10-27_dach_energy/companies/novacrest-energy.md so I don't lose it.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: outreach-update-card-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?outreach-update-card"'
