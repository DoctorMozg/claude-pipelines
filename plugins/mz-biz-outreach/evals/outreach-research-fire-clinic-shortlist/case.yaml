schema_version: "1.1"
name: outreach-research-fire-clinic-shortlist
description: Asking which companies in a market should be approached first, with ranking and current context, is target discovery that belongs to outreach-research even with no skill vocabulary.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-creative", "../../../mz-base", "../../../mz-job-outreach"]
execution:
  prompt: >-
    we sell scheduling software to physio clinics. which UK chains should we be
    going after first? i want 20 names, ranked, with a line on why each one fits
    and what's been happening at them lately
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: outreach-research-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?outreach-research"'
