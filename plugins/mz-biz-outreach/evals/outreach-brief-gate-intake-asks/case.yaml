schema_version: "1.1"
name: outreach-brief-gate-intake-asks
description: 'A seed that names only an offer, a sector and a city makes the intake loop ask for the missing brief fields, and no brief or climate research is produced.'
tags: [track-d, gate]
plugins: ["../..", "../../../mz-creative", "../../../mz-base"]
# Write is a gated tool: make eval PLUGIN=mz-biz-outreach EVAL_ARGS="--allow-tools Write Edit --case outreach-brief-gate-*"
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-biz-outreach:outreach-brief bookkeeping automation for small accountancies in Leeds
  allowed_tools: [Read, Write, Edit, Glob, Agent]
  max_turns: 10
  timeout_seconds: 300
graders:
  # AskUserQuestion isn't available in eval sessions, so the intake questions can only be asked in chat.
  - name: asks-who-the-buyer-is
    type: regex
    pattern: 'buyer|decision[- ]maker'
    flags: i
  - name: asks-about-channels
    type: regex
    pattern: 'channels?|email|linkedin'
    flags: i
  - name: asks-about-the-goal-or-the-proof
    type: regex
    pattern: '\bgoal\b|proof|case stud|differentiat|value prop'
    flags: i
  - name: no-gate-before-the-brief-is-complete
    type: regex
    pattern: 'Brief ready for review'
    match: not_contains
  - name: no-brief-or-climate-file-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*(?:brief\.(?:json|md)|climate)'
    min: 0
    max: 0
  - name: no-climate-agents
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?outreach-climate-(?:source-finder|researcher)"'
    min: 0
    max: 0
