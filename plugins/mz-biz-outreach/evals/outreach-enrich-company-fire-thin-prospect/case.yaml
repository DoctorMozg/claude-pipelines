schema_version: "1.1"
name: outreach-enrich-company-fire-thin-prospect
description: Adding missing intelligence to an already profiled prospect, with no path given, belongs to outreach-enrich-company in its research-only mode.
tags: [routing, fire, held-out]
plugins: ["../..", "../../../mz-creative", "../../../mz-base", "../../../mz-job-outreach"]
execution:
  prompt: >-
    We already have a saved profile on Stackwell Logistics from last week's prospecting
    run, but it's thin and I have a call with them Thursday. I need way more: recent news,
    their tech stack, how quickly they're hiring, what people say about working there.
    Keep what's already in the profile and add the new stuff to it. No messages yet, and
    don't go hunting for other companies.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: outreach-enrich-company-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?outreach-enrich-company"'
