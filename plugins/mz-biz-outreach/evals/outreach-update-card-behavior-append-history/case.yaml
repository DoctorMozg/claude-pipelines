schema_version: "1.1"
name: outreach-update-card-behavior-append-history
description: 'Logging a touch through a stale baseline path updates the already-active card instead, appends the entry as the last bullet of its history, and leaves every other card untouched.'
tags: [track-d, behavior, needs-bash]
plugins: ["../..", "../../../mz-creative", "../../../mz-base"]
# Bash is a gated tool: make eval PLUGIN=mz-biz-outreach EVAL_ARGS="--allow-tools Write Bash --case outreach-update-card-behavior-*"
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    /mz-biz-outreach:outreach-update-card .mz/outreach/2026_10_28_outreach_research_logistics/companies/kestrel-marine.md "Phone call: ops director wants us to circle back in January (no budget before Q1)"
  allowed_tools: [Read, Write, Bash]
  max_turns: 20
  timeout_seconds: 420
graders:
  # A slash prompt loads the skill without a Skill call, so the date command is the proof that Step 4 ran.
  - name: date-taken-from-the-shell
    type: tool_used
    tool: Bash
    input_match: 'date\s+(?:\\?["''])?\+%Y-%m-%d'
  # The seed history keeps its order and the new bullet comes last, dated like the new filename (\1), verbatim, with the letters footer still directly above the section.
  - name: entry-appended-last-in-existing-history
    type: tool_used
    tool: Write
    input_match: '^(?=[\s\S]*"file_path"\s*:\s*"(?:[^"]*/)?\.mz/outreach/active/(\d{4}-\d{2}-\d{2})_kestrel-marine\.md")(?=[\s\S]*reverted: 0\*\\n\\n## Interaction History\\n\\n- \*\*2026-10-03\*\* (?:—|\\u2014) Sent intro email to Mikael Dahl\\n- \*\*2026-10-20\*\* (?:—|\\u2014) Mikael replied, asked for a pricing sheet\\n- \*\*\1\*\* (?:—|\\u2014) Phone call: ops director wants us to circle back in January \(no budget before Q1\)\\n")'
  # The active card wins over the path the user passed: its refreshed overview survives and the baseline wording never appears.
  - name: written-from-the-active-version
    type: tool_used
    tool: Write
    input_match: '^(?=[\s\S]*\.mz/outreach/active/\d{4}-\d{2}-\d{2}_kestrel-marine\.md)(?=[\s\S]*Overview refreshed after the intro call)(?=[\s\S]*## Outreach Letters)(?![\s\S]*Baseline research pass)'
  - name: history-heading-not-duplicated
    type: tool_used
    tool: Write
    input_match: '^(?=[\s\S]*\.mz/outreach/active/\d{4}-\d{2}-\d{2}_kestrel-marine\.md)(?![\s\S]*## Interaction History[\s\S]*## Interaction History)'
  - name: exactly-one-write
    type: tool_used
    tool: Write
    min: 1
    max: 1
  - name: report-says-section-is-existing
    type: regex
    pattern: 'appended to existing'
    flags: i
  # The active card is dated today, so source equals target and the skill must not touch the baseline it was pointed at.
  - name: stale-baseline-intact
    type: regex
    pattern: 'Baseline research pass[\s\S]*Generated: 2026-10-14 \| Sources: Kestrel site, LinkedIn\*\n$'
    target: { source: file, path: .mz/outreach/2026_10_28_outreach_research_logistics/companies/kestrel-marine.md }
  - name: stale-baseline-not-touched
    type: regex
    pattern: 'Interaction History|circle back|Overview refreshed'
    match: not_contains
    target: { source: file, path: .mz/outreach/2026_10_28_outreach_research_logistics/companies/kestrel-marine.md }
  - name: fjordline-active-card-intact
    type: regex
    pattern: 'coastal container feeders[\s\S]*## Interaction History\n\n- \*\*2026-10-15\*\* — Called Lars, he wants a demo in two weeks\n$'
    target: { source: file, path: .mz/outreach/active/2026-10-15_fjordline-shipping.md }
  - name: fjordline-active-card-not-touched
    type: regex
    pattern: 'Kestrel|circle back|January'
    match: not_contains
    target: { source: file, path: .mz/outreach/active/2026-10-15_fjordline-shipping.md }
  - name: brightline-baseline-intact
    type: regex
    pattern: 'refrigerated trailers[\s\S]*Generated: 2026-10-28 \| Sources: Brightline site, LinkedIn\*\n$'
    target: { source: file, path: .mz/outreach/2026_10_28_outreach_research_logistics/companies/brightline-logistics.md }
  - name: brightline-baseline-not-touched
    type: regex
    pattern: 'Interaction History|Kestrel|circle back'
    match: not_contains
    target: { source: file, path: .mz/outreach/2026_10_28_outreach_research_logistics/companies/brightline-logistics.md }
