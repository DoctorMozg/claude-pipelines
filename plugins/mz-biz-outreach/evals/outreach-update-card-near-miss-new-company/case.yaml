schema_version: "1.1"
name: outreach-update-card-near-miss-new-company
description: Building a first company card for a prospect nobody has researched yet is outreach-research work, since the update skill only appends to a card that already exists.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-creative", "../../../mz-base", "../../../mz-job-outreach"]
execution:
  prompt: >-
    We've never touched Tidewater Robotics (tidewater-robotics.com) and I have no card
    for them. Research them from scratch and set one up with the decision makers and
    a recommendation on how to approach them, I want to start outreach next week.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: outreach-update-card-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?outreach-update-card"'
    min: 0
    max: 0
    arm: both
  - name: outreach-research-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?outreach-research"'
