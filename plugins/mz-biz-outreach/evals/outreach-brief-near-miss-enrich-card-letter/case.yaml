schema_version: "1.1"
name: outreach-brief-near-miss-enrich-card-letter
description: Deepening one existing company card and writing a LinkedIn message from it belongs to outreach-enrich-company.
tags: [routing, near-miss]
plugins: ["../..", "../../../mz-creative", "../../../mz-base", "../../../mz-job-outreach"]
execution:
  prompt: >-
    I've got a card at
    .mz/outreach/2026_10_14_outreach_dach_devops/companies/helvetia-cloud.md.
    Dig deeper on that company and write a LinkedIn message to their CTO.
  allowed_tools: [Skill]
  max_turns: 2
  timeout_seconds: 180
graders:
  - name: outreach-brief-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?outreach-brief"'
    min: 0
    max: 0
    arm: both
